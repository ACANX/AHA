# AHA 默认模型供应商配置（classpath:ModelDefault.yml）
#
# 该文件提供内置默认供应商；用户级 Model.yml
# （${AHA_HOME:-~/.aha}/Model.yml，或由 Aha.yaml 的 Llm.ModelFile 指定）
# 会覆盖同名供应商，并以其中的 Default 作为当前选中的供应商。
#
# 一键切换供应商：  aha provider use <ProviderId>
# 查看供应商列表：  aha provider list
# 查看单家明细：    aha provider show <ProviderId>
# 切换模型档位：    aha model use <档位|模型 ID|模型名>   （Ultra/Pro/Standard/Flash/Fallback）
# 新增供应商：      aha provider add <ProviderId> --api-type openai-compatible \
#                       --base-url <url> --model-standard <name> [--api-key <key>] [--default]
# 删除供应商：      aha provider remove <ProviderId>
#
# 字段命名规范：YAML 字段统一 PascalCase；模型 ID（Models 下的键）不受此限。
# ApiKey 支持 ${ENV} / ${ENV:-default} 占位。
# BaseUrl 为「基础地址」，适配器负责拼接端点路径（如 /chat/completions）。
#
# 新格式说明：
#   Models: 模型 ID → 模型定义（Name 为实际请求模型名，另有 Reasoning / Input /
#           ContextWindow / MaxTokens / ThinkingLevelMap 等能力字段，均可省略）
#   Tier:   档位 → 模型 ID；默认档固定 Standard（未配置时按全局 DefaultTier →
#           档位强弱顺序兜底）
#   ApiType: openai-compatible | anthropic-messages | gemini
#
# 模型名以各家官方模型列表为准（不编造模型名，缺档留空）。参考价（¥ / 百万 tokens，
# 输入 / 输出）仅作量级参考，实际以国内平台定价为准。

Model:
  # 当前默认（选中）的供应商
  Default: OpenAI
  # 可选：全局默认档，缺省 Standard（Standard 缺失时用于兜底）
  DefaultTier: Standard

  Providers:
    # ── OpenAI：五档区分度大（旗舰 / 主力 / 轻量三层）───────────────
    OpenAI:
      ApiType: openai-compatible
      BaseUrl: "https://api.openai.com/v1"
      ApiKey: '${AHA_API_KEY_OPENAI}'
      Models:
        gpt-6-astra:
          Name: gpt-6-astra
          Reasoning: true
        gpt-6.1-sol:
          Name: gpt-6.1-sol
          Reasoning: true
        gpt-6-sol:
          Name: gpt-6-sol
        gpt-6-luna:
          Name: gpt-6-luna
      Tier:
        Ultra: gpt-6-astra
        Pro: gpt-6.1-sol
        Standard: gpt-6-sol
        Flash: gpt-6-luna
        Fallback: gpt-6-luna
      TimeoutSeconds: 120
      MaxRetries: 3
      RateLimit:
        Rpm: 60
        Tpm: 100000

    # ── Anthropic：Fable / Opus / Sonnet / Haiku 四线 ────────────────
    Anthropic:
      ApiType: anthropic-messages
      BaseUrl: https://api.anthropic.com
      ApiKey: '${AHA_API_KEY_ANTHROPIC}'
      Models:
        claude-fable-5-1:
          Name: claude-fable-5-1
          Reasoning: true
        claude-opus-5-5:
          Name: claude-opus-5-5
          Reasoning: true
        claude-sonnet-5-5:
          Name: claude-sonnet-5-5
        claude-haiku-5-5:
          Name: claude-haiku-5-5
      Tier:
        Ultra: claude-fable-5-1
        Pro: claude-opus-5-5
        Standard: claude-sonnet-5-5
        Flash: claude-haiku-5-5
        Fallback: claude-haiku-5-5
      TimeoutSeconds: 120
      MaxRetries: 3
      RateLimit:
        Rpm: 60
        Tpm: 100000

    # ── Gemini：Pro 线最新到 3.1（Flash 已到 3.8）──────────────────
    Gemini:
      ApiType: gemini
      BaseUrl: https://generativelanguage.googleapis.com
      ApiKey: '${AHA_API_KEY_GEMINI}'
      Models:
        gemini-3.1-pro-preview:
          Name: gemini-3.1-pro-preview
          Reasoning: true
        gemini-3.8-flash:
          Name: gemini-3.8-flash
        gemini-flash-lite-latest:
          Name: gemini-flash-lite-latest
      Tier:
        Ultra: gemini-3.1-pro-preview
        Pro: gemini-3.1-pro-preview
        Standard: gemini-3.8-flash
        Flash: gemini-3.8-flash
        Fallback: gemini-flash-lite-latest
      TimeoutSeconds: 120
      MaxRetries: 3
      RateLimit:
        Rpm: 60
        Tpm: 100000

    # ── DeepSeek：五档趋于同值 ─────────────────────────────────────
    DeepSeek:
      ApiType: openai-compatible
      BaseUrl: https://api.deepseek.com/v1
      ApiKey: '${AHA_API_KEY_DEEPSEEK}'
      Models:
        deepseek-v4-pro:
          Name: deepseek-v4-pro
          Reasoning: true
        deepseek-v4-flash:
          Name: deepseek-v4-flash
      Tier:
        Ultra: deepseek-v4-pro
        Pro: deepseek-v4-pro
        Standard: deepseek-v4-flash
        Flash: deepseek-v4-flash
        Fallback: deepseek-v4-flash
      TimeoutSeconds: 120
      MaxRetries: 3
      RateLimit:
        Rpm: 60
        Tpm: 100000

    # ── 智谱 GLM（BigModelCN）：flashx / flash 拉开价格 ──────────────
    BigModelCN:
      ApiType: openai-compatible
      BaseUrl: https://open.bigmodel.cn/api/paas/v4
      ApiKey: '${AHA_API_KEY_BIG_MODEL_CN}'
      Models:
        glm-5.3:
          Name: glm-5.3
          Reasoning: true
        glm-5.3-flashx:
          Name: glm-5.3-flashx
        glm-5.3-flash:
          Name: glm-5.3-flash
      Tier:
        Ultra: glm-5.3
        Pro: glm-5.3
        Standard: glm-5.3
        Flash: glm-5.3-flashx
        Fallback: glm-5.3-flash
      TimeoutSeconds: 120
      MaxRetries: 3
      RateLimit:
        Rpm: 60
        Tpm: 100000

    # ── 通义千问（Qwen）────────────────────────────────────────────
    Qwen:
      ApiType: openai-compatible
      BaseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
      ApiKey: '${AHA_API_KEY_QWEN}'
      Models:
        qwen3.8-max:
          Name: qwen3.8-max
          Reasoning: true
        qwen3.7-plus:
          Name: qwen3.7-plus
        qwen3.8-flash:
          Name: qwen3.8-flash
      Tier:
        Ultra: qwen3.8-max
        Pro: qwen3.8-max
        Standard: qwen3.7-plus
        Flash: qwen3.8-flash
        Fallback: qwen3.8-flash
      TimeoutSeconds: 120
      MaxRetries: 3
      RateLimit:
        Rpm: 60
        Tpm: 100000

    # ── 月之暗面（Moonshot / Kimi）：模型较少，五档多有同值 ──────────
    Moonshot:
      ApiType: openai-compatible
      BaseUrl: https://api.moonshot.cn/v1
      ApiKey: '${AHA_API_KEY_MOONSHOT}'
      Models:
        kimi-k3:
          Name: kimi-k3
          Reasoning: true
        kimi-k2.7-code-highspeed:
          Name: kimi-k2.7-code-highspeed
        kimi-k2.7-code:
          Name: kimi-k2.7-code
        kimi-k2.6:
          Name: kimi-k2.6
      Tier:
        Ultra: kimi-k3
        Pro: kimi-k2.7-code-highspeed
        Standard: kimi-k2.7-code
        Flash: kimi-k2.6
        Fallback: kimi-k2.6
      TimeoutSeconds: 120
      MaxRetries: 3
      RateLimit:
        Rpm: 60
        Tpm: 100000

    # ── MiniMax：定价扁平，五档多为同价 ─────────────────────────────
    MiniMax:
      ApiType: openai-compatible
      BaseUrl: https://api.minimax.chat/v1
      ApiKey: '${AHA_API_KEY_MINI_MAX}'
      Models:
        MiniMax-M3:
          Name: MiniMax-M3
        MiniMax-M2.7:
          Name: MiniMax-M2.7
        MiniMax-M2.5:
          Name: MiniMax-M2.5
        MiniMax-M2.1:
          Name: MiniMax-M2.1
      Tier:
        Ultra: MiniMax-M3
        Pro: MiniMax-M3
        Standard: MiniMax-M2.7
        Flash: MiniMax-M2.5
        Fallback: MiniMax-M2.1
      TimeoutSeconds: 120
      MaxRetries: 3
      RateLimit:
        Rpm: 60
        Tpm: 100000
