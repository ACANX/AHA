<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="AHA agent harness logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="bulb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset="0.35" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>

    <radialGradient id="bulbInner" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#FFFBEB" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FDE68A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow" cx="50%" cy="47%" r="55%">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBEB"/>
      <stop offset="0.45" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="screwMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#6B7280"/>
      <stop offset="0.18" stop-color="#9CA3AF"/>
      <stop offset="0.45" stop-color="#E5E7EB"/>
      <stop offset="0.6"  stop-color="#D1D5DB"/>
      <stop offset="0.82" stop-color="#9CA3AF"/>
      <stop offset="1"    stop-color="#6B7280"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <filter id="rayGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#F59E0B" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="64" fill="url(#bg)"/>
  <circle cx="300" cy="285" r="230" fill="url(#glow)"/>

  <g stroke="#FBBF24" stroke-width="12" stroke-linecap="round" filter="url(#rayGlow)" opacity="0.92">
    <line x1="300" y1="120" x2="300" y2="75"/>
    <line x1="378" y1="142" x2="410" y2="104"/>
    <line x1="435" y1="200" x2="473" y2="177"/>
    <line x1="455" y1="285" x2="500" y2="285"/>
    <line x1="435" y1="370" x2="473" y2="393"/>
    <line x1="165" y1="370" x2="127" y2="393"/>
    <line x1="145" y1="285" x2="100" y2="285"/>
    <line x1="165" y1="200" x2="127" y2="177"/>
    <line x1="222" y1="142" x2="190" y2="104"/>
  </g>

  <!-- 螺纹 -->
  <path d="M238 396 L362 396 L348 480 L252 480 Z" fill="url(#screwMetal)"/>

  <line x1="239" y1="417" x2="361" y2="407" stroke="#4B5563" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="241" y1="432" x2="359" y2="422" stroke="#4B5563" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="243" y1="447" x2="357" y2="437" stroke="#4B5563" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="245" y1="462" x2="355" y2="452" stroke="#4B5563" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="247" y1="475" x2="353" y2="467" stroke="#4B5563" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <line x1="240" y1="420" x2="360" y2="410" stroke="#F9FAFB" stroke-width="1.8" stroke-linecap="round" opacity="0.42"/>
  <line x1="242" y1="435" x2="358" y2="425" stroke="#F9FAFB" stroke-width="1.8" stroke-linecap="round" opacity="0.42"/>
  <line x1="244" y1="450" x2="356" y2="440" stroke="#F9FAFB" stroke-width="1.8" stroke-linecap="round" opacity="0.42"/>
  <line x1="246" y1="465" x2="354" y2="455" stroke="#F9FAFB" stroke-width="1.8" stroke-linecap="round" opacity="0.42"/>

  <rect x="256" y="480" width="88" height="12" rx="6" fill="#4B5563"/>

  <!-- 灯泡主体 -->
  <path d="M300 150
           c-72 0-130 56-130 126
           0 46 24 78 50 102
           14 12 22 26 25 42
           h111
           c3-16 11-30 25-42
           26-24 50-56 50-102
           0-70-58-126-131-126 z"
        fill="url(#bulb)" filter="url(#softShadow)"/>

  <path d="M300 150
           c-72 0-130 56-130 126
           0 46 24 78 50 102
           14 12 22 26 25 42
           h111
           c3-16 11-30 25-42
           26-24 50-56 50-102
           0-70-58-126-131-126 z"
        fill="url(#bulbInner)"/>

  <path d="M300 150
           c-72 0-130 56-130 126
           0 46 24 78 50 102
           14 12 22 26 25 42
           h111
           c3-16 11-30 25-42
           26-24 50-56 50-102
           0-70-58-126-131-126 z"
        fill="none" stroke="#FEF3C7" stroke-width="2" opacity="0.30"/>

  <!-- 表情：提高对比度 -->
  <g opacity="0.8">
    <path d="M244 270 Q260 256 278 267" fill="none" stroke="#5B2107" stroke-width="8" stroke-linecap="round"/>
    <path d="M322 272 Q338 268 354 276" fill="none" stroke="#5B2107" stroke-width="8" stroke-linecap="round"/>

    <circle cx="262" cy="310" r="15" fill="#5B2107"/>
    <circle cx="257" cy="305" r="5.5" fill="#FFFFFF"/>
    <circle cx="266" cy="315" r="2.5" fill="#FFFFFF" opacity="0.9"/>

    <path d="M320 310 Q338 298 356 310" fill="none" stroke="#5B2107" stroke-width="9" stroke-linecap="round"/>

    <path d="M268 350 Q300 370 340 344" fill="none" stroke="#5B2107" stroke-width="9" stroke-linecap="round"/>
    <circle cx="342" cy="344" r="4.5" fill="#5B2107"/>
  </g>

  <path d="M232 190 C240 158 268 140 300 136 C266 148 246 172 242 202 C240 214 228 222 218 219 C223 210 229 200 232 190 Z"
        fill="#FFFFFF" opacity="0.34"/>

  <ellipse cx="300" cy="222" rx="115" ry="40" fill="#FBBF24" opacity="0.15"
           filter="url(#rayGlow)"/>

  <text x="300" y="234" text-anchor="middle"
        font-family="'Poppins', 'Quicksand', 'Nunito', 'Varela Round', 'Comfortaa', 'Segoe UI', Arial, sans-serif"
        font-size="64" font-weight="800"
        letter-spacing="6"
        fill="#5B2107" opacity="0.55">AHA</text>

  <text x="300" y="230" text-anchor="middle"
        font-family="'Poppins', 'Quicksand', 'Nunito', 'Varela Round', 'Comfortaa', 'Segoe UI', Arial, sans-serif"
        font-size="64" font-weight="800"
        letter-spacing="6"
        fill="url(#textGrad)"
        stroke="#92400E" stroke-width="4"
        paint-order="stroke fill"
        filter="url(#textGlow)">AHA</text>

  <text x="300" y="228" text-anchor="middle"
        font-family="'Poppins', 'Quicksand', 'Nunito', 'Varela Round', 'Comfortaa', 'Segoe UI', Arial, sans-serif"
        font-size="64" font-weight="800"
        letter-spacing="6"
        fill="#FFFBEB" opacity="0.35">AHA</text>

  <path d="M232 250 Q 266 260 300 254 Q 334 248 368 258"
        fill="none" stroke="#FCD34D" stroke-width="2.5"
        stroke-linecap="round" opacity="0.45"/>
</svg>