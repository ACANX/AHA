name: VersionBump

# 一键切换基线版本：手动输入新版本号 → 分发到所有「版本出现位置」 → 开 PR。
#
# 人只改一处（根目录 `version` 文件，或在触发时输入），其余由
# `Script/Python/VersionDistribute.py` 动态分发（POM / version 文件 / 代码常量 / 文档声明），
# 设计见 TD-00016 §H。
#
# 触发：仅手动。输入留空时取 `version` 文件当前值（分发器会拒绝「与当前相同」的空提交）。
#
# 验证时机（重要）：用默认 `GITHUB_TOKEN` 推的提交**不触发下游 workflow**（GitHub 防递归的
#   既定行为），所以这个 PR 上**不会**自动跑 `Build` / `CodeQL`；`Gate` / `Compat` 另因
#   `pull_request` 只覆盖 `main` / `release/**` 也不会跑。本仓库**不为此配置 PAT**——
#   验证由**合并到 `dev` 之后**自动触发的流水线承担：`Build.yml`（`on: [push, pull_request]`）
#   + `BuildJVMArtifacts` / `CliNative` / `DesktopNative`（`push: branches: [dev]`）。
#   它们走 `push` 事件，不受 `GITHUB_TOKEN` 限制。PR 侧由本 workflow 的「自检」步骤把关。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '新版本号（如 0.1.3）；留空则取 version 文件当前值'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

# 同一时间只允许一次分发；并发触发时后到的取消先到的
concurrency:
  group: version-bump
  cancel-in-progress: true

jobs:
  bump:
    name: 分发并开 PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # 开 PR 需要能相对 base 生成 diff，取完整历史更省心
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: 解析目标版本（唯一读取入口）
        id: v
        run: |
          VERSION=$(python3 .github/Python/ProjectVersion.py --resolve "${{ inputs.version }}")
          test -n "${VERSION}"
          echo "目标版本：${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: 分发到所有版本位置（POM / version 文件 / 代码常量 / 文档声明）
        run: python3 Script/Python/VersionDistribute.py --version "${{ steps.v.outputs.version }}"

      - name: 自检（文档围栏 / 脚本编码行尾 / 版本读取）
        # 产物级的「五处一致」在合并到 dev 后由 Build / Gate 承担（见文件头「验证时机」）；
        # 这里刚分发完、尚未构建，读不到产物，故只做不依赖构建的检查。
        run: |
          python3 bin/CheckDocs.py
          python3 bin/CheckScripts.py
          python3 .github/Python/ProjectVersion.py --resolve

      - name: 说明验证时机（PR 上不跑 checks，合并到 dev 后自动验证）
        run: |
          {
            echo "## 验证时机"
            echo
            echo "本 PR 上不会自动跑 \`Build\` / \`CodeQL\`（\`GITHUB_TOKEN\` 推的提交不触发下游 workflow），"
            echo "\`Gate\` / \`Compat\` 也因 \`pull_request\` 只覆盖 \`main\` / \`release/**\` 而不跑。"
            echo
            echo "正确性由两处保证："
            echo "1. 本 workflow 的自检步骤（\`CheckDocs\` / \`CheckScripts\` / \`ProjectVersion.py\`）；"
            echo "2. **合并到 \`dev\` 后**自动触发的流水线：\`Build\` + \`BuildJVMArtifacts\` / \`CliNative\` / \`DesktopNative\`。"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 开 PR（分支 chore/bump-<版本>，base dev）
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: chore/bump-${{ steps.v.outputs.version }}
          base: dev
          title: "chore(release): 基线版本切换到 ${{ steps.v.outputs.version }}"
          commit-message: "chore(release): 基线版本切换到 ${{ steps.v.outputs.version }}"
          body: |
            ## 自动分发

            由 `VersionBump.yml` 触发、`Script/Python/VersionDistribute.py` 分发新版本号：

            **新版本**：`${{ steps.v.outputs.version }}`

            分发清单（逐文件）见本次 workflow 运行的 Job Summary。

            ### 检查

            - 本 PR 上**不会**自动跑 `Build` / `CodeQL`（`GITHUB_TOKEN` 推的提交不触发下游
              workflow），`Gate` / `Compat` 也因 `pull_request` 只覆盖 `main` / `release/**` 而不跑。
            - 正确性由「本 workflow 的自检步骤」+「**合并到 `dev` 后**自动触发的流水线」保证：
              `Build`（编译与单测）与 `BuildJVMArtifacts` / `CliNative` / `DesktopNative`（出包）。
              合并后到 Actions 看这几条运行结果即可。
            - 分发内容（逐文件）见本次 workflow 运行的 Job Summary。
