name: BuildJVMArtifacts

# ── 这是什么 ────────────────────────────────────────────────────────────────────
# dev 分支的 **JVM 构建与打包发布线**：每次合并到 dev 就出一版可直接运行的 JVM 便携包，
# 挂到发布页（预发行）供下载验证。
#
# 这是 DesktopNative.yml / CliNative.yml 的 JVM 姊妹工作流：同一套「独立工作流 + 预发行」
# 约定，只是不做原生编译，直接产出 JVM 便携包（桌面端 + CLI）。
#
# ── 为什么单独一个工作流（四条隔离）───────────────────────────────────────────
# 1. **不参与快检查**：Build.yml 每次 push / PR 只做编译与单测（快检查）；
#    本线只在 push 到 dev 时跑，不拖慢每次 PR，也不与 Build.yml 的作业互相牵连。
# 2. **不影响发版流程**：预发行 tag 带 `-aha-jvm` 后缀，与正式发版（`V<版本号>`）及
#    原生线（`-aha-desktop-native` / `-aha-cli-native`）区分，不进 releases/latest。
# 3. **不是必需检查**：作业名与 Build / Gate / Compat 全不同，分支保护不引用它。
# 4. **可被打断**：同一分支的新一次运行会取消上一次（见 concurrency）。
# 5. **可被复用**：暴露 `workflow_call`（输入 pr / version / matrix / publish），
#    快照线 SnapshotJVM.yml 直接调用它，**不复制**构建与打包步骤——两套实现必然漂移。
#    默认矩阵与发布行为与改造前逐条一致（push dev 行为不变）。
#
# ── JDK 轴：25（基线）+ 27 ──────────────────────────────────────────────────
# 矩阵同时出 **JDK 25**（默认，release=25）与 **JDK 27**（`-Dmaven.compiler.release=27`）
# 两份产物：JDK 27 的包名带 `-jdk27` 后缀，与 JDK 25 基线并存不冲突。
# 编译 JDK 由 setup-java 按矩阵切换；release 由命令行显式给（不动根 POM 的 25 默认）。
#
# ── 版本号规则 ──────────────────────────────────────────────────────────────────
#     <基线版本>.<PR 号，补零到 5 位>
# 基线 ← 根 pom.xml 的 <version>；PR 号 ← push 到 dev 时按提交 SHA 反查
# （workflow_dispatch 时可显式传入）。
# 例：PR #63 合进 dev，当基线是 0.1.1 → 0.1.1.00063

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      pr:
        description: PR 号（用于 a.b.c.PPPPP 的版本号；留空则按当前提交反查）
        required: false
        default: ''
      version:
        description: 直接指定完整版本号（覆盖 PR 推导，用于重打某一版）
        required: false
        default: ''
      matrix:
        description: 构建矩阵（JSON 数组；留空 = 默认三平台 × JDK 25/27 共六条腿）
        required: false
        default: ''
      publish:
        description: 是否挂到发布页（true / false；快照线由调用方自己发布，故传 false）
        required: false
        default: 'true'
  # 可被其它工作流复用（快照线 SnapshotJVM.yml 就是调用方，见 issue #165）。
  # **默认不发布**：载体由调用方决定（快照走 `snapshot-pr<N>`），避免误往 dev 线的 tag 上写。
  workflow_call:
    inputs:
      pr:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: false
        default: ''
      matrix:
        type: string
        required: false
        default: ''
      publish:
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# 同一分支只保留最新一次：dev 上连续合并时，旧的构建没有价值。
# 注意这是**本工作流自己的**并发组，不碰其它工作流。
concurrency:
  group: build-jvm-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Windows 运行器上也有 bash（Git Bash）；统一用它，脚本只有一套。
    shell: bash

jobs:
  # ── 1. 算版本（所有腿共用同一个版本号）────────────────────────────────────
  BuildVersion:
    name: BuildVersion
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      base: ${{ steps.compute.outputs.base }}
      pr: ${{ steps.compute.outputs.pr }}
      #: 要出的腿（`<label>/jdk<JDK>` 逗号分隔）。腿作业的**步骤级** if 用它过滤——
      #: job 级 if 读不到 matrix，动态矩阵又会让作业被静默丢弃，都不可用。
      selected: ${{ steps.matrix.outputs.selected }}
      #: 本次要不要挂发布页（由脚本归一成 `true` / `false` 字符串；见下一步的说明）。
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: NormalizePublishFlag
        # 【为什么把判断放脚本里，而不是写进 build-publish 的 job 级 if】
        # 那个门原先写的是 `inputs.publish != false && inputs.publish != 'false'`，
        # 但 `push` 事件**没有 inputs** ⇒ `inputs.publish` 为 `null`；GitHub 表达式做宽松比较时
        # 把两侧折算成数字（`null → 0`、`false → 0`）⇒ `null != false` 求值为 `0 != 0` = **false**
        # ⇒ 作业被**静默跳过**：dev 的 JVM 预发行包自 2026-10-14 06:52 起再没发布过
        # （#179 引入，见 issue #213）。落到 shell 就是普通字符串比较，没有折算坑。
        id: publish
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          # push 事件没有 inputs ⇒ 变量为空 ⇒ 默认 true（照旧发布）
          publish="${INPUT_PUBLISH:-true}"
          case "$publish" in
            false|False|FALSE) publish=false ;;
            *) publish=true ;;
          esac
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "本次是否挂发布页：${publish}"

      - name: ValidateMatrixAndSelectLegs
        id: matrix
        env:
          INPUT_MATRIX: ${{ inputs.matrix }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # 矩阵逻辑在仓库脚本里（.github/Python/JvmMatrix.py）：可本地跑、可自检。
          # **不要**把 Python 写进这里的块标量：代码行顶格会被 YAML 当成新的键，
          # 块标量 + 管道 + 重定向叠加还会吃掉行尾空格（两坑都已踩过）。
          python3 .github/Python/JvmMatrix.py --validate "${INPUT_MATRIX}" > "$RUNNER_TEMP/matrix.txt"
          head -n1 "$RUNNER_TEMP/matrix.txt"
          selected=$(tail -n1 "$RUNNER_TEMP/matrix.txt")
          echo "本次要出的腿：${selected}"
          printf 'selected=%s\n' "${selected}" >> "$GITHUB_OUTPUT"

      - name: ComputeVersion
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # ① 显式给了完整版本号：直接用它（重打历史版本时用）
          if [ -n "${INPUT_VERSION}" ]; then
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "base=${INPUT_VERSION%.*}" >> "$GITHUB_OUTPUT"
            echo "pr=0" >> "$GITHUB_OUTPUT"
            echo "使用显式版本：${INPUT_VERSION}"
            exit 0
          fi

          # ② 基线经唯一读取入口解析（`version` 文件 → 根 POM 的 `<properties>/<revision>`
          #    → `<version>`），见 TD-00016 §B。
          base=$(python3 .github/Python/ProjectVersion.py --resolve)

          # ③ PR 号：先看输入，其次按提交 SHA 反查（push 事件没有 PR 号）。
          pr="${INPUT_PR:-}"
          if [ -z "$pr" ]; then
            pr=$(curl -sS --max-time 30 \
                   -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/${REPO}/commits/${SHA}/pulls" \
                 | python3 -c "import json,sys
          d = json.load(sys.stdin)
          print(d[0]['number'] if isinstance(d, list) and d else '')" 2>/dev/null || true)
          fi
          if [ -z "$pr" ]; then
            # 直接 push 到 dev 或 API 限流：不猜假 PR 号，明确记 00000 并告警。
            echo "::warning::没能确定 PR 号（直接 push 或 API 限流），版本里的 PR 段记为 00000"
            pr=0
          fi

          version=$(printf '%s.%05d' "$base" "$pr")
          {
            echo "base=${base}"
            echo "pr=${pr}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          echo "JVM dev 版本 = ${version}（基线 ${base} + PR ${pr}）"
          {
            echo "### JVM dev 版本：\`${version}\`"
            echo ""
            echo "基线 ${base}，来源 PR #${pr}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 2. 三条腿各出自己平台的 JVM 便携包 ─────────────────────────────────────
  #    每个 runner 只能产出自己平台的桌面端包（JavaFX 原生库按平台分类器发布）；
  #    CLI 包平台无关，只在一条腿产出。
  # ── 2. 每条腿各出自己平台的 JVM 便携包 ─────────────────────────────────────
  #    每个 runner 只能产出自己平台的桌面端包（JavaFX 原生库按平台分类器发布）；
  #    CLI 包平台无关，只在一条腿产出。
  #
  # 【为什么是六个静态作业，而不是矩阵】（issue #287）
  #   作业的 `name` 必须是静态字符串（不许 `${{ … }}`、标点、中文），矩阵只能靠表达式区分腿。
  #   逐腿作业 + 共用 `BuildMvnArtifactLeg.yml`：逻辑一份，名字全静态。
  #   收窄靠 **job 级 `if`**（读 `needs.BuildVersion.outputs.selected`）：未选中的腿直接 skipped。
  BuildMvnArtifactUbuntuAmd64JDK25:
    name: BuildMvnArtifactUbuntuAmd64JDK25
    needs: BuildVersion
    if: >-
      needs.BuildVersion.outputs.selected == ''
      || contains(needs.BuildVersion.outputs.selected, 'ubuntu-amd64/jdk25')
    uses: ./.github/workflows/BuildMvnArtifactLeg.yml
    with:
      os: ubuntu-latest
      label: ubuntu-amd64
      jdk: '25'
      upload_cli: true
      version: ${{ needs.BuildVersion.outputs.version }}

  BuildMvnArtifactUbuntuAmd64JDK27:
    name: BuildMvnArtifactUbuntuAmd64JDK27
    needs: BuildVersion
    if: >-
      needs.BuildVersion.outputs.selected == ''
      || contains(needs.BuildVersion.outputs.selected, 'ubuntu-amd64/jdk27')
    uses: ./.github/workflows/BuildMvnArtifactLeg.yml
    with:
      os: ubuntu-latest
      label: ubuntu-amd64
      jdk: '27'
      upload_cli: true
      version: ${{ needs.BuildVersion.outputs.version }}

  BuildMvnArtifactWindowsAmd64JDK25:
    name: BuildMvnArtifactWindowsAmd64JDK25
    needs: BuildVersion
    if: >-
      needs.BuildVersion.outputs.selected == ''
      || contains(needs.BuildVersion.outputs.selected, 'windows-amd64/jdk25')
    uses: ./.github/workflows/BuildMvnArtifactLeg.yml
    with:
      os: windows-latest
      label: windows-amd64
      jdk: '25'
      upload_cli: false
      version: ${{ needs.BuildVersion.outputs.version }}

  BuildMvnArtifactWindowsAmd64JDK27:
    name: BuildMvnArtifactWindowsAmd64JDK27
    needs: BuildVersion
    if: >-
      needs.BuildVersion.outputs.selected == ''
      || contains(needs.BuildVersion.outputs.selected, 'windows-amd64/jdk27')
    uses: ./.github/workflows/BuildMvnArtifactLeg.yml
    with:
      os: windows-latest
      label: windows-amd64
      jdk: '27'
      upload_cli: false
      version: ${{ needs.BuildVersion.outputs.version }}

  BuildMvnArtifactMacOSAarch64JDK25:
    name: BuildMvnArtifactMacOSAarch64JDK25
    needs: BuildVersion
    if: >-
      needs.BuildVersion.outputs.selected == ''
      || contains(needs.BuildVersion.outputs.selected, 'macos-aarch64/jdk25')
    uses: ./.github/workflows/BuildMvnArtifactLeg.yml
    with:
      os: macos-latest
      label: macos-aarch64
      jdk: '25'
      upload_cli: false
      version: ${{ needs.BuildVersion.outputs.version }}

  BuildMvnArtifactMacOSAarch64JDK27:
    name: BuildMvnArtifactMacOSAarch64JDK27
    needs: BuildVersion
    if: >-
      needs.BuildVersion.outputs.selected == ''
      || contains(needs.BuildVersion.outputs.selected, 'macos-aarch64/jdk27')
    uses: ./.github/workflows/BuildMvnArtifactLeg.yml
    with:
      os: macos-latest
      label: macos-aarch64
      jdk: '27'
      upload_cli: false
      version: ${{ needs.BuildVersion.outputs.version }}

  # ── 3. 汇总发布（预发行版）─────────────────────────────────────────────────
  BuildPublish:
    name: BuildPublish
    needs:
      - BuildVersion
      - BuildMvnArtifactUbuntuAmd64JDK25
      - BuildMvnArtifactWindowsAmd64JDK25
      - BuildMvnArtifactMacOSAarch64JDK25
      - BuildMvnArtifactUbuntuAmd64JDK27
      - BuildMvnArtifactWindowsAmd64JDK27
      - BuildMvnArtifactMacOSAarch64JDK27
    # 即使某条腿失败也要发布已成功的那几个平台（部分可用也有价值）；
    # 但显式给了 publish=false 时（快照线 / 自证）不发布——载体由调用方自己决定。
    # 判断读 build-version 归一后的字符串（**不要**在这里直接比 `inputs.publish`：
    # `push` 无 inputs ⇒ 它为 null，而 `null != false` 是 **false**，作业会被静默跳过，见 issue #213）。
    if: >-
      always() && needs.BuildVersion.result == 'success'
      && needs.BuildVersion.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      # 要跑仓库里的脚本（发布前生成 SHA256SUMS 用 .github/Python/PackageManifest.py），
      # 必须先检出；下面的 download-artifact 只往 artifacts/ 里放产物，两者不是一回事，
      # 且上传步骤只列 artifacts/*，不会把工作区文件当成发布资产。
      - uses: actions/checkout@v7
      - name: DownloadAllArtifacts
        # 没有任何制品时下载可能报错——这属于「本次无可发布产物」的正常分支。
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: CollectAssets
        id: collect
        continue-on-error: true
        run: |
          set -uo pipefail
          shopt -s nullglob
          # download-artifact 会把每个制品的 zip 放在自己的子目录里，先收平到 artifacts/ 顶层
          find artifacts -mindepth 2 -name '*.zip' -exec mv -n {} artifacts/ \; 2>/dev/null || true
          files=(artifacts/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "::warning::本次没有任何 JVM 包可发布（各腿结论见各自摘要）"
            {
              echo "### JVM dev：本次无可发布产物"
              echo ""
              echo "三条腿都没有产出可用的包，因此**未创建预发行版**。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # CLI-JVM：内容平台无关，但按三平台各出一份**同内容**的名字（issue #269 §6 第 7 条）。
          # 否则 Windows / macOS 用户按本平台名取件会落空（只有 ubuntu 一个名字）。
          cli_src=""
          for f in artifacts/aha-cli-jvm-*.zip; do
            [ -e "$f" ] || continue
            cli_src="$f"; break
          done
          if [ -n "${cli_src}" ]; then
            cli_version=$(basename "${cli_src}" | sed -E 's/^aha-cli-jvm-([0-9.]+)-.*-jdk([0-9]+)\.zip$/\1/')
            cli_jdk=$(basename "${cli_src}" | sed -E 's/.*-jdk([0-9]+)\.zip$/\1/')
            for platform in windows-amd64 ubuntu-amd64 macos-aarch64; do
              cp -f "${cli_src}" "artifacts/aha-cli-jvm-${cli_version}-${platform}-jdk${cli_jdk}.zip"
            done
            files=(artifacts/*.zip)
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          ls -lh "${files[@]}"
          {
            echo "### JVM dev：本次可发布 ${#files[@]} 个包"
            echo ""
            for f in "${files[@]}"; do
              echo "- \`$(basename "$f")\`（$(du -h "$f" | cut -f1)）"
            done
            echo ""
            echo "> 解压即可运行：桌面端需 JDK 25（包内含本平台 OpenJFX）；CLI 包平台无关。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: GenerateChecksums
        if: steps.collect.outputs.any == 'true'
        run: |
          set -euo pipefail
          # 每个 zip 一行：用户拿到任一资产都能自己核一遍。
          # 「没有校验和」是有代价的（升级器要退到包内清单 + 落地前自证），所以宁可多写一行。
          PYTHONUTF8=1 PYTHONIOENCODING=utf-8 python3 .github/Python/PackageManifest.py sums --dir artifacts

      - name: PublishPreRelease
        if: steps.collect.outputs.any == 'true'
        uses: softprops/action-gh-release@v3
        with:
          # tag 带 -aha-jvm 后缀与正式发版（V*）和原生线（-aha-desktop-native / -aha-cli-native）区分。
          tag_name: V${{ needs.BuildVersion.outputs.version }}-aha-jvm
          name: V${{ needs.BuildVersion.outputs.version }}-AHA-JVM
          prerelease: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          body: |
            ## 这是什么

            以 `dev` 分支最新合并的代码构建的 **JVM 便携包**（非原生镜像）：
            解压即可运行，桌面端需本机 JDK 25，CLI 包平台无关。

            > ⚠️ **dev 预发行产物，不是正式发行包。** 正式版本请用 `V<版本号>` 的
            > 发版页面；这里的东西用来「验证 dev 最新合并」。

            ## 版本
            - 本版版本号：`${{ needs.BuildVersion.outputs.version }}`
            - 基线版本：`${{ needs.BuildVersion.outputs.base }}`（读自根 pom.xml）
            - 来源 PR：#${{ needs.BuildVersion.outputs.pr }}

            ## 包含什么
            - `aha-desktop-<版本>-<平台>.zip` / `aha-cli-<版本>.zip`：**JDK 25 基线**，
              Java 25 字节码，需 JDK 25；
            - `aha-desktop-<版本>-<平台>-jdk27.zip` / `aha-cli-<版本>-jdk27.zip`：**JDK 27**，
              Java 27 字节码（major=71），需 JDK 27。

            ## 怎么用
            1. 按你的系统与 JDK 选对应包（`-jdk27` 后缀的需 JDK 27）；
            2. 解压后运行 `bin/AhaDesktop.bat`（Windows）或 `bin/AhaDesktop.sh`（Linux/macOS），
               CLI 运行 `bin/AhaCli.bat` / `bin/AhaCli.sh`；
            3. 配置与数据在 `AHA_HOME`（默认 `~/.aha`）。
