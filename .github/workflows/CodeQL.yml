# 【与门禁的分工】CodeQL 只做安全分析；编译、测试、覆盖率、文档等由 Build / Gate / Compat 负责。

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # 每周一 04:00 UTC（错开 Gate 的 03:00，避免互相排队）
    - cron: '0 4 * * 1'
  workflow_dispatch:

# 只读代码 + 必须写安全事件（上传 SARIF），其余一律不要
permissions:
  contents: read
  security-events: write
  actions: read

