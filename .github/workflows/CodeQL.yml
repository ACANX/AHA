name: CodeQL

# 存在的理由：`main` 的规则集里有一条 `code_scanning` 规则——它要求 **CodeQL** 的扫描结果
# （阈值 `security_alerts_threshold=high_or_higher`、`alerts_threshold=errors`）。
# 而仓库此前**没有任何 code scanning 配置**，于是 PR #7（`dev` → `main`）永远停在：
#
#     Waiting for Code Scanning results. Code Scanning may not be configured for the target branch.
#
# 这类「等不到结果」比红色更麻烦：红色会告诉你哪里错，等待不会。规则要什么，就得有人生产什么。
#
# 【为什么用工作流，而不是 GitHub 的「默认设置】（Default setup）】
# 默认设置由平台托管，其扫描范围是**默认分支**及指向它的 PR；本仓库默认分支是 `dev`，
# 而 PR #7 的目标是 `main`。工作流方式能把 `pull_request: branches: [main, dev]` 写死在这里，
# 覆盖目标分支，且不会因为某个设置项被改动而悄悄失效。
# （说明：这一点未能在本环境核实——docs.github.com 与 raw 源均被限流；但工作流方案不依赖它。）
#
# 【与其它工作流的关系】
# 它**不参与**必需检查：规则集用的是 `code_scanning` 规则（按扫描结果判定），
# 不是 `required_status_checks`。所以新增本工作流不会改动作业名契约（见 BuildSpec 第 8.1 节）。
#
# 【与门禁的分工】CodeQL 只做安全分析；编译、测试、覆盖率、文档等由 Build / Gate / Compat 负责。

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # 每周一 04:00 UTC（错开 Gate 的 03:00，避免互相排队）
    - cron: '0 4 * * 1'
  workflow_dispatch:

# 只读代码 + 必须写安全事件（上传 SARIF），其余一律不要
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL（java-kotlin）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # 手工构建：由下面的步骤自己跑 Maven。这样用的是本仓库固定的工具链
          # （Wrapper 的 Maven 4.0.0-rc-7 + JDK 25），与门禁完全一致。
          #
          # ⚠️ 若 CodeQL 报「build-mode 取值不合法」，删掉这一行即可：
          #    不指定时它对已编译语言会尝试自动构建，而自动构建往往认不出 Maven 4 RC 的 Wrapper。
          build-mode: manual

      - name: 编译（CodeQL 需要真实编译产物）
        # 经统一的 Maven 入口：会先清本地仓库失败标记，并对仓库侧瞬时故障定向重试
        # （见 BuildSpec 第 8.1 节「CI 必须容忍仓库侧瞬时失败」）
        uses: ./.github/actions/maven-run
        with:
          command: ./mvnw -B -DskipTests -Djacoco.skip=true compile

      - name: 分析并上传结果
        uses: github/codeql-action/analyze@v3
