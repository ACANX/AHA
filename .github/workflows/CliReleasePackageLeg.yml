name: CliReleasePackageLeg

# 可复用工作流：`Release.yml` 的一条 CLI-JVM 打包腿（issue #269）。
#
# 【为什么按平台拆腿】CLI-JVM 自 0.1.4 起按平台各出一份（`aha-cli-jvm-<版本>-<平台>-jdk25.zip`），
# 三条腿各自在对应 runner 上构建与打包，资产名里的平台段对应真实产物。
#
# 【与桌面端腿的区别】桌面端必须在自己平台构建（JavaFX 原生库按分类器发布）；
# CLI 是平台无关的 jar，但按 #269 的口径仍按平台出包，便于用户按平台取件与核对。
on:
  workflow_call:
    inputs:
      os:
        description: runner 标签
        type: string
        required: true
      label:
        description: 平台标签（ubuntu-amd64 / windows-amd64 / macos-aarch64）
        type: string
        required: true
      ref:
        description: 发布 tag（`push` 下是 tag，派发下是入参）
        type: string
        required: true

# 可复用工作流不继承调用方的 `defaults.run.shell`：漏了这段，Windows 腿会按 pwsh 解释 bash。
defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  CliReleasePackageLeg:
    name: CliReleasePackageLeg
    runs-on: ${{ inputs.os }}
    steps:
      # 显式检出**发布 tag**而不用默认的 `github.sha`：`workflow_dispatch` 下 `github.ref` 是分支，
      # 靠默认值会取到分支头部（issue #238）。push tag 事件下两者本就是同一个提交。
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: BuildAndVerify
        # 有意重跑一次：发行包必须由「自身跑过门禁的构建」产出，
        # 不复用 gate 另一个 runner 上的产物（跨 job 传产物只会让链路更难查）。
        uses: ./.github/actions/maven-run
        with:
          command: ./mvnw clean verify
      - name: PackageCliDistribution
        shell: bash
        env:
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          # 版本从**唯一读取入口**取（issue #93 / #94）：平铺后包内 jar 名不含版本号。
          version=$(python3 .github/Python/ProjectVersion.py --resolve)
          target="Dist/aha-cli-jvm-${version}-${LABEL}-jdk25.zip"
          # 包内形态（issue #218）：平铺 —— 单体 jar + 启动脚本 + 文档，全在包根。
          # 用 Python 的 zipfile 而不是 `zip`：Windows / macOS runner 上没有 `zip`（exit 127），
          # 而 `python3` 三条腿都有（同一套脚本必须能在三种 OS 上跑）。
          # 只列这几个入口：将来 Dist/ 里再放别的产物也不会被误收；
          # 缺文件时 `zipfile.write` 会直接报错，因此这里本身就是「六个入口都在」的断言。
          python3 -c "import sys,zipfile; t=sys.argv[1]; z=zipfile.ZipFile(t,'w',zipfile.ZIP_DEFLATED); [z.write('Dist/'+n, n) for n in sys.argv[2:]]; z.close()" \
            "$target" aha-cli.jar AhaCli.sh AhaCli.bat README.md LICENSE CHANGELOG.md
          ls -lh "$target"
          # 包内自证：不得再有 lib/ 与 bin/（退回 JPMS 目录形态 ⇒ 直接失败）
          entries="${RUNNER_TEMP}/cli-release-entries.txt"
          "$JAVA_HOME/bin/jar" tf "$target" > "$entries"
          if grep -Eq '^(lib|bin)/' "$entries"; then
            echo "::error::CLI 包内不应再有 lib/ 或 bin/ 目录（issue #218）"
            grep -E '^(lib|bin)/' "$entries" | head -5
            exit 1
          fi
          for f in aha-cli.jar AhaCli.sh README.md LICENSE CHANGELOG.md; do
            if ! grep -qx "$f" "$entries"; then
              echo "::error::CLI 包内缺少 ${f}（应平铺在包根）"; exit 1
            fi
          done
          # Windows 包额外带 .bat（issue #381：POSIX 包不再要求它）
          case "${LABEL}" in
            windows-*)
              if ! grep -qx 'AhaCli.bat' "$entries"; then
                echo "::error::Windows 包内缺少 AhaCli.bat（应平铺在包根）"; exit 1
              fi
              ;;
          esac
          echo "CLI 包：${target}（平铺形态，共 $(wc -l < "$entries") 个条目）"
          # ── 按平台裁剪（issue #381）────────────────────────────────────
          # POSIX 包不应带 Windows 专属脚本（.bat / .cmd / .ps1）；Windows 包保持现状。
          # 必须在“生成包内清单”之前裁剪，否则清单会出现「有、包里没有」。
          python3 .github/Python/PrunePlatformScripts.py --zip "${target}" --platform "${LABEL}"
          python3 .github/Python/PrunePlatformScripts.py --zip "${target}" --platform "${LABEL}" --check-only
          # ── 包内清单（issue #51 §6）────────────────────────────────────────
          PYTHONUTF8=1 PYTHONIOENCODING=utf-8 python3 .github/Python/PackageManifest.py generate \
            --zip "${target}" --kind cli-jvm --version "${version}" --platform "${LABEL}" --jdk 25
          PYTHONUTF8=1 PYTHONIOENCODING=utf-8 python3 .github/Python/PackageManifest.py verify \
            --zip "${target}" --kind cli-jvm --version "${version}" --platform "${LABEL}"
      - name: UploadReleaseAssets
        uses: softprops/action-gh-release@v3
        with:
          # `tag_name` 必须显式指定：该 action 默认按 `github.ref` 找 release（issue #238）。
          tag_name: ${{ inputs.ref }}
          files: Dist/aha-cli-jvm-*-${{ inputs.label }}-jdk25.zip
