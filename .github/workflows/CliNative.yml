name: CliNative

# ── 这是什么 ────────────────────────────────────────────────────────────────────
# 把 aha-cli 的 JVM 产物再编译成 **GraalVM native-image 二进制**（终端里直接可跑的原生程序），
# 每次合并到 dev 就出一版，挂到发布页供下载验证。
#
# 这是 DesktopNative.yml 的**姊妹工作流**：同一套隔离约定与发布方式，
# 只是输入换成 aha-cli、主类换成 AhaCli、依赖里没有 JavaFX（多了 JLine / picocli）。
# 两者刻意**分成两个工作流**：各自失败不牵连对方，参数与产物也各自独立。
#
# ── 为什么单独一个工作流（四条隔离）───────────────────────────────────────────
# 1. **不参与反应堆**：aha-cli-native 只在父 POM 的 `cli-native` profile 里，
#    `./mvnw clean verify` 根本看不到它 → 原生镜像编不出来不会挡住 Build / Gate / Compat。
# 2. **不影响发版流程**：tag 前缀是 `V…-aha-cli-native`，**不匹配** Release.yml 的 `V*` / `v*`
#    正式发版约定（发布为**预发行版**），也不会打乱 `V<版本号>` 的约定。
# 3. **不是必需检查**：作业名与 Build / Gate / Compat / DesktopNative 全不同，分支保护不引用它。
# 4. **可被打断**：原生镜像构建慢，同一分支的新一次运行会取消上一次（见 concurrency）。
#
# ── 关于「可选」：怎么才算真的非阻塞 ───────────────────────────────────────────
# 同 DesktopNative：`CliNativeImageLeg.yml` 内部的作业级 continue-on-error 只保证「整次运行」不变红，
# **作业本身仍显示红叉**。要让作业也绿，必须把容错放到**步骤级**，
# 再由各作业末尾的「结论」步骤把真实情况写进 Job Summary。
# 取舍写明：**原生编译真坏了，CI 不会红**，只表现为摘要里少一版、发布页少一个包。
# 这是刻意的——它是数据点，不是交付物（见 Docs/Design/CliNativeDesign.md）。
#
# ── 版本号规则 ──────────────────────────────────────────────────────────────────
#     <基线版本>.<PR 号，补零到 5 位>
# 基线与 PR 号都从「唯一来源」推导：基线 ← 根 pom.xml 的 <version>；
# PR 号 ← pull_request 事件自带 / push 到 dev 时按提交 SHA 反查。
# 例：PR #36 合进 dev，当基线是 0.1.1 → 0.1.1.00036
#
on:
  push:
    branches: [dev]
  # PR 上也跑：快照出包要在**合并前**可用（#165 §三）。默认不出包 —— 只有打了
  # 触发标签 `SNAPSHOT:NativeCli` / 发了 `/snapshot NativeCli …` 命令才出（判定逻辑在脚本里）。
  # 【注意】`types` 一旦写出来就覆盖默认值，所以默认的三个必须一并列出。
  # 【为什么**不再**用 `paths:` 过滤（2026-10-15 实测 #203）】同 DesktopNative.yml：
  # `paths:` 在**触发层**过滤，会让「只改文档 + 新打触发标签」的显式请求进不来
  # （现象：打了标签毫无反应），与 #165 验收 16 冲突。改为让 `plan` 先跑、
  # 昂贵的腿按 `needs.Plan.outputs.should_build` 门控。
  # 路径清单的唯一来源仍是 `.github/SnapshotPaths.yml`（由判定脚本消费），本文件不写死任何路径；
  # `bin/CheckScripts.py` 的 `pull_request_paths_filters()` 会拦住再往回加 `paths:` 的改动。
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR 号（用于 a.b.c.PPPPP 的版本号；留空则按当前提交反查）
        required: false
        default: ''
      version:
        description: 直接指定完整版本号（覆盖 PR 推导，用于重打某一版）
        required: false
        default: ''
      target:
        description: 手动出快照时的目标（留空则按 PR 标签判定）
        required: false
        default: 'Cli-Native'
      os:
        description: 手动出快照时的平台限定（Win / MacOS / Ubuntu，可空格分隔多个；留空 = 全部平台）
        required: false
        default: ''

permissions:
  contents: write
  # 评论作业要新建 / 修改 PR 评论 ⇒ `gh api` 走 issues 接口，缺这一项会 403
  # （实测：`gh: Resource not accessible by integration (HTTP 403)`）。
  # 顶层 `permissions` 会**覆盖**仓库默认权限，所以必须显式写上（与 SnapshotJVM.yml 对齐）。
  issues: write
  # 快照发布按目标挂 pre-release 时也要读 / 写 PR 信息（关联说明）。
  pull-requests: write

# 同一分支只保留最新一次：原生镜像构建慢，旧的运行没有价值。
#
# 【为什么把「显式请求」单独分一组（2026-10-15 实测 PR #203）】
# 只按 `github.ref` 分组时，`pull_request` 的 `labeled` 与 `synchronize` 落在**同一组**，
# `cancel-in-progress` 会让后到的 `synchronize` 取消先到的 `labeled` ——
# 「打完触发标签紧接着 push / 同步 base」正是这么踩的：显式请求的 run 被吞，什么都不出。
# 现在按**事件类别**分两组：
#   * `explicit`：labeled / unlabeled / issue_comment / workflow_dispatch（用户显式动作）；
#   * `auto`：opened / synchronize / reopened / push（自动事件）。
# 两组互不取消；各自组内仍只保留最新一次（连续 push 依旧只跑最后一条）。
# 【写法注意】GitHub Actions 表达式**没有三元运算符** `? :` —— 用 `cond && 'explicit' || 'auto'`
# 模拟（写成 `? :` 会让工作流在**校验阶段**直接失效：报「workflow file issue」，且不产生任何日志）。
# 【为什么键里用 PR 号而不是 `github.ref`】issue_comment / workflow_dispatch 的
# `github.ref` 是**默认分支**，多个 PR 会共享同一组而互相取消（与 SnapshotJVM.yml 对齐）。
concurrency:
  group: >-
    cli-native-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.ref }}-${{
    ((github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled')) || github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch') && 'explicit' || 'auto' }}
  cancel-in-progress: true

defaults:
  run:
    # Windows 运行器上也有 bash（Git Bash）；统一用它，脚本只有一套。
    shell: bash

jobs:
  # ── 0. 判定（快照出包要不要出、出哪些腿、版本号；逻辑全在 .github/Python/SnapshotPlan.py）──
  #    本工作流只负责**一个**原生目标：`Cli-Native`（桌面目标由 DesktopNative.yml 负责）。
  #    请求里不含本目标时，`owns_comment=false` ⇒ 不构建、也**不动 PR 评论**（两条线互不覆盖）。
  Plan:
    name: Plan
    runs-on: ubuntu-latest
    # 什么时候跑 plan：
    #   * `push`（合入 dev）：**跳过** —— 那时没有 PR 号，判定脚本会以「没能确定 PR 号」
    #     退出 1 把整次运行染红；而构建腿靠 `github.event_name == 'push'` 照跑、包照发，
    #     红叉纯属噪声（下方 `cli-native-image` 的注释也写着「dev/push 时它被跳过」）；
    #   * `issue_comment`：只认 `/snapshot` 开头、且确实挂在 PR 上的评论（否则每条评论都起一次 run）；
    #   * 其余（pull_request / workflow_dispatch）：照常判定。
    # 排除 `/snapshot-assert*`（快照自测留痕，issue #166）：它是 `/snapshot` 前缀，但由
    # SnapshotAssert.yml 负责；不排除的话，这条命令会让本工作流回一条
    # 「命令格式应为 `/snapshot <target> [os ...]`」（误导性回复 + 一次空跑）。
    if: >-
      github.event_name != 'push'
      && (github.event_name != 'issue_comment'
          || (github.event.issue.pull_request != null
              && startsWith(github.event.comment.body, '/snapshot')
              && !startsWith(github.event.comment.body, '/snapshot-assert')))
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      pr: ${{ steps.plan.outputs.pr }}
      version: ${{ steps.plan.outputs.version }}
      platforms: ${{ steps.plan.outputs.platforms }}
      legs: ${{ steps.plan.outputs.legs }}
      releases: ${{ steps.plan.outputs.releases }}
      assets: ${{ steps.plan.outputs.assets }}
      owns_comment: ${{ steps.plan.outputs.owns_comment }}
      marker: ${{ steps.plan.outputs.marker }}
      comment: ${{ steps.plan.outputs.comment }}
    steps:
      - uses: actions/checkout@v7

      - name: ResolveSnapshotPlan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_PR: ${{ inputs.pr }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          COMMENT: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_OS: ${{ inputs.os }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            pull_request) pr="${EVENT_PR}" ;;
            issue_comment) pr="${EVENT_ISSUE}" ;;
            *) pr="${INPUT_PR:-}" ;;
          esac
          if [ -z "${pr}" ]; then
            echo "::error::没能确定 PR 号（workflow_dispatch 需要显式传 pr）"
            exit 1
          fi
          echo "PR #${pr}"
          gh api --paginate "repos/${REPO}/pulls/${pr}/files" --jq '.[].filename' > changed-files.txt || true
          echo "改动文件数：$(wc -l < changed-files.txt)"
          PR="${pr}" CHANGED_FILES=changed-files.txt \
            BASELINE="$(python3 .github/Python/ProjectVersion.py --resolve)" \
            python3 .github/Python/SnapshotPlan.py --line native --native-target Cli-Native --emit-outputs

  # ── 1. 算版本（单独一个作业：三条腿共用同一个版本号）────────────────────────
  CliNativeVersion:
    name: CliNativeVersion
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      base: ${{ steps.compute.outputs.base }}
      pr: ${{ steps.compute.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
      - name: ComputeVersion
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION}" ]; then
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "base=${INPUT_VERSION%.*}" >> "$GITHUB_OUTPUT"
            echo "pr=0" >> "$GITHUB_OUTPUT"
            echo "使用显式版本：${INPUT_VERSION}"
            exit 0
          fi

          # 基线经唯一读取入口解析（`version` 文件 → 根 POM 的 `<properties>/<revision>`
          # → `<version>`），见 TD-00016 §B。
          base=$(python3 .github/Python/ProjectVersion.py --resolve)

          pr="${INPUT_PR:-}"
          if [ -z "$pr" ]; then
            pr=$(curl -sS --max-time 30 \
                   -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H "Accept: application/vnd.github+json" \
                   "https://api.github.com/repos/${REPO}/commits/${SHA}/pulls" \
                 | python3 -c "import json,sys
          d = json.load(sys.stdin)
          print(d[0]['number'] if isinstance(d, list) and d else '')" 2>/dev/null || true)
          fi
          if [ -z "$pr" ]; then
            echo "::warning::没能确定 PR 号（直接 push 或 API 限流），版本里的 PR 段记为 00000"
            pr=0
          fi

          version=$(printf '%s.%05d' "$base" "$pr")
          {
            echo "base=${base}"
            echo "pr=${pr}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          echo "版本 = ${version}（基线 ${base} + PR ${pr}，PR 段补零到 5 位）"
          echo "### CLI 原生镜像版本：\`${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "基线 ${base}，PR #${pr}" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. 每条腿各编自己平台的原生镜像 ────────────────────────────────────────
  #    每个 runner 只能产出自己平台的二进制（native-image 不能交叉编译）。
  #
  # 【为什么是五个静态作业，而不是矩阵】（issue #287）
  #   作业的 `name` 必须是静态字符串（不许 `${{ … }}`、标点、中文），矩阵只能靠表达式区分腿。
  #   逐腿作业 + 共用 `CliNativeImageLeg.yml`：逻辑一份，名字全静态。
  #   收窄靠 **job 级 `if`**（读 `needs.Plan.outputs.legs`）：未选中的腿直接 skipped。

  CliNativeImageUbuntuAmd64GraalVM25:
    name: CliNativeImageUbuntuAmd64GraalVM25
    needs:
      - Plan
      - CliNativeVersion
    if: >-
      always() && !cancelled()
      && needs.CliNativeVersion.result == 'success'
      && (github.event_name == 'push' || needs.Plan.outputs.should_build == 'true')
      && (needs.Plan.outputs.should_build != 'true'
          || contains(needs.Plan.outputs.legs, '"ubuntu-amd64/jdk25"'))
    uses: ./.github/workflows/CliNativeImageLeg.yml
    with:
      os: ubuntu-latest
      label: ubuntu-amd64
      platform: ubuntu
      jdk: '25'
      aha_version: ${{ needs.Plan.outputs.version || needs.CliNativeVersion.outputs.version }}

  CliNativeImageWindowsAmd64GraalVM25:
    name: CliNativeImageWindowsAmd64GraalVM25
    needs:
      - Plan
      - CliNativeVersion
    if: >-
      always() && !cancelled()
      && needs.CliNativeVersion.result == 'success'
      && (github.event_name == 'push' || needs.Plan.outputs.should_build == 'true')
      && (needs.Plan.outputs.should_build != 'true'
          || contains(needs.Plan.outputs.legs, '"windows-amd64/jdk25"'))
    uses: ./.github/workflows/CliNativeImageLeg.yml
    with:
      os: windows-latest
      label: windows-amd64
      platform: win
      jdk: '25'
      aha_version: ${{ needs.Plan.outputs.version || needs.CliNativeVersion.outputs.version }}

  CliNativeImageMacOSAarch64GraalVM25:
    name: CliNativeImageMacOSAarch64GraalVM25
    needs:
      - Plan
      - CliNativeVersion
    if: >-
      always() && !cancelled()
      && needs.CliNativeVersion.result == 'success'
      && (github.event_name == 'push' || needs.Plan.outputs.should_build == 'true')
      && (needs.Plan.outputs.should_build != 'true'
          || contains(needs.Plan.outputs.legs, '"macos-aarch64/jdk25"'))
    uses: ./.github/workflows/CliNativeImageLeg.yml
    with:
      os: macos-latest
      label: macos-aarch64
      platform: mac-aarch64
      jdk: '25'
      aha_version: ${{ needs.Plan.outputs.version || needs.CliNativeVersion.outputs.version }}

  CliNativeImageWindowsAmd64GraalVM27:
    name: CliNativeImageWindowsAmd64GraalVM27
    needs:
      - Plan
      - CliNativeVersion
    if: >-
      always() && !cancelled()
      && needs.CliNativeVersion.result == 'success'
      && (github.event_name == 'push' || needs.Plan.outputs.should_build == 'true')
      && (needs.Plan.outputs.should_build != 'true'
          || contains(needs.Plan.outputs.legs, '"windows-amd64/jdk27"'))
    uses: ./.github/workflows/CliNativeImageLeg.yml
    with:
      os: windows-latest
      label: windows-amd64
      platform: win
      jdk: '27'
      aha_version: ${{ needs.Plan.outputs.version || needs.CliNativeVersion.outputs.version }}

  CliNativeImageUbuntuAmd64GraalVM27:
    name: CliNativeImageUbuntuAmd64GraalVM27
    needs:
      - Plan
      - CliNativeVersion
    if: >-
      always() && !cancelled()
      && needs.CliNativeVersion.result == 'success'
      && (github.event_name == 'push' || needs.Plan.outputs.should_build == 'true')
      && (needs.Plan.outputs.should_build != 'true'
          || contains(needs.Plan.outputs.legs, '"ubuntu-amd64/jdk27"'))
    uses: ./.github/workflows/CliNativeImageLeg.yml
    with:
      os: ubuntu-latest
      label: ubuntu-amd64
      platform: ubuntu
      jdk: '27'
      aha_version: ${{ needs.Plan.outputs.version || needs.CliNativeVersion.outputs.version }}
  # ── 3. 汇总发布（预发行版）─────────────────────────────────────────────────
  CliNativePublish:
    name: CliNativePublish
    needs:
      - Plan
      - CliNativeVersion
      - CliNativeImageUbuntuAmd64GraalVM25
      - CliNativeImageWindowsAmd64GraalVM25
      - CliNativeImageMacOSAarch64GraalVM25
      - CliNativeImageWindowsAmd64GraalVM27
      - CliNativeImageUbuntuAmd64GraalVM27
    env:
      AHA_VERSION: ${{ needs.Plan.outputs.version || needs.CliNativeVersion.outputs.version }}
    # 即使某条腿失败也要发布已成功的那几个平台（试验性产物，部分可用也有价值）。
    # 发布条件：push 到 dev（既有）或快照请求（判定 should_build）——普通 PR 不发（只留制品）。
    if: >-
      always() && !cancelled()
      && needs.CliNativeVersion.result == 'success'
      && (github.event_name == 'push' || needs.Plan.outputs.should_build == 'true')
    runs-on: ubuntu-latest
    steps:
      # 要跑仓库里的脚本（发布前生成 SHA256SUMS 用 .github/Python/PackageManifest.py），
      # 必须先检出；下面的 download-artifact 只往 artifacts/ 里放产物，两者不是一回事，
      # 且上传步骤只列 artifacts/*，不会把工作区文件当成发布资产。
      - uses: actions/checkout@v7
      - name: DownloadAllArtifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: CollectAssets
        id: collect
        continue-on-error: true
        run: |
          set -uo pipefail
          shopt -s nullglob
          find artifacts -mindepth 2 -name '*.zip' -exec mv -n {} artifacts/ \; 2>/dev/null || true
          files=(artifacts/*.zip)
          images=(); reports=()
          for f in "${files[@]}"; do
            case "$(basename "$f")" in
              *-Report-*) reports+=("$f") ;;
              *)          images+=("$f") ;;
            esac
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "::warning::本次没有任何原生包可发布（各腿结论见各自摘要）"
            {
              echo "### CLI 原生镜像：本次无可发布产物"
              echo ""
              echo "没有任何一条腿编出二进制，因此**未创建预发行版**。"
              echo ""
              echo "这是可选管线：不影响 Build / Gate / Compat，也不挡合并。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          ls -lh "${files[@]}"
          {
            echo "### CLI 原生镜像：本次可发布 ${#files[@]} 个包"
            echo ""
            echo "**镜像包**（${#images[@]} 个，给人运行）"
            for f in "${images[@]}"; do
              echo "- \`$(basename "$f")\`（$(du -h "$f" | cut -f1)）"
            done
            echo ""
            echo "**独立报告包**（${#reports[@]} 个，给人分析：构建报告 + 镜像参数 + 可达性元数据）"
            for f in "${reports[@]}"; do
              echo "- \`$(basename "$f")\`（$(du -h "$f" | cut -f1)）"
            done
            echo ""
            echo "> 两类包**同名族**（版本 / 系统 / 架构 / JDK 轴一致），下载时按需取件、一一对应。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ResolveReleaseCarrier
        id: carrier
        env:
          RELEASES: ${{ needs.Plan.outputs.releases }}
        run: |
          set -euo pipefail
          if [ "${{ needs.Plan.outputs.should_build }}" = "true" ]; then
            tag=$(python3 -c 'import json,os; g=json.loads(os.environ["RELEASES"]); print(g[0]["tag"] if g else "")')
            name="${tag}"
            echo "载体：快照 pre-release（${tag}）"
          else
            tag="V${AHA_VERSION}-aha-cli-native"
            name="V${AHA_VERSION}-AHA-Cli-Native-Image"
            echo "载体：dev 线预发行版（${tag}）"
          fi
          {
            echo "tag=${tag}"
            echo "name=${name}"
          } >> "$GITHUB_OUTPUT"

      - name: GenerateChecksums
        if: steps.collect.outputs.any == 'true'
        run: |
          set -euo pipefail
          # 每个 zip 一行（含报告包）：升级器只用得上镜像包，但用户拿到任一资产都该能自己核一遍。
          PYTHONUTF8=1 PYTHONIOENCODING=utf-8 python3 .github/Python/PackageManifest.py sums --dir artifacts

      - name: PublishPreRelease
        if: steps.collect.outputs.any == 'true'
        uses: softprops/action-gh-release@v3
        with:
          # 快照 ⇒ `V<快照版本>-AHA-Cli-Native`（prerelease: true；`Release.yml` 已排除 `-AHA-*`）；
          # dev 线 ⇒ 原有的 `native-v` 语义（tag 里带 -aha-cli-native 与桌面端区分）。
          tag_name: ${{ steps.carrier.outputs.tag }}
          name: ${{ steps.carrier.outputs.name }}
          prerelease: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS
          body: |
            ## 这是什么

            以 `aha-cli` 的 JVM 产物为输入，用 GraalVM native-image 编成的**平台原生可执行文件**：
            解压即用，不需要本机装 JDK。

            > ⚠️ **试验性产物，不是正式发行包。** 正式使用请选 JVM 版
            > （`Dist/` 下的 CLI 发行包）。这里的东西用来「下载下来就能跑」。

            ## 版本
            - 本版版本号：`${{ env.AHA_VERSION }}`
            - 基线版本：`${{ needs.CliNativeVersion.outputs.base }}`（读自根 pom.xml）
            - 来源 PR：#${{ needs.CliNativeVersion.outputs.pr }}

            ## 怎么用
            1. 按你的系统下载对应 zip（`jdk25` 是基线，`jdk27` 是试验分支）；
            2. 解压后在终端运行 `aha-cli-native`（Linux / macOS 首次可能需要 `chmod +x`）；
            3. 不带参数会进入交互式对话；配置与数据与 JVM 版共用（`AHA_HOME`，默认 `~/.aha`）。

            ## 包内附带的构建参数
            镜像包里有 `native-image-args.txt`（JDK 25 基线）与 `native-image-args-jdk27.txt`
            （JDK 27 试验），两者 diff 就是这一版做的实验改动。

            ## 独立报告包（与镜像包同族命名）
            每腿另有一个 `aha-cli-native-<版本>-<系统>-<架构>-graalvm<JDK>-report.zip`，
            内含 native-image 构建报告、镜像参数、可达性元数据与 picocli 生成的反射元数据。

  # ── 4. 回写 PR 评论（**幂等**：同一条评论反复编辑，见 #165 §六）──────────────
  #    与桌面端原生线共用 `<!-- aha-snapshot-native -->` 标记 —— 两者**不会**同时认领同一 PR：
  #    一个工作流只负责一个目标，请求里不含本目标时 `owns_comment=false`（见判定脚本）。
  Comment:
    name: Comment
    needs:
      - Plan
      - CliNativePublish
    if: >-
      always() && !cancelled() && needs.Plan.outputs.pr != ''
      && needs.Plan.outputs.owns_comment != 'false'
    runs-on: ubuntu-latest
    steps:
      # 要跑仓库里的脚本，先检出（评论作业此前不需要工作区，现在需要）。
      - uses: actions/checkout@v7

      - name: UpsertPullRequestComment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.Plan.outputs.pr }}
          MARKER: ${{ needs.Plan.outputs.marker }}
          BODY: ${{ needs.Plan.outputs.comment }}
        run: |
          set -euo pipefail
          # 定位「自己那条」评论（按标记）→ 有就 PATCH、没有就 POST；503/429/超时**有界重试**。
          # 这些逻辑放在脚本里：此前三条工作流各抄一份 shell，同一个缺陷要修三遍
          # （本轮修了两次：`gh api --jq --arg`、缺 `issues: write`），且一次 API 503 就让 PR 变红。
          printf '%s\n' "${BODY}" | python3 .github/Python/SnapshotComment.py \
            --repo "${REPO}" --pr "${PR}" --marker "${MARKER}"
