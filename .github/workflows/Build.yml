name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      # 不要让一条腿失败就取消其余：Windows 与 Linux 的失败原因常常不同，
      # 早退回会把可用的信息（其余腿的日志）一起丢掉。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            maven: wrapper
            optional: false
          - os: ubuntu-latest
            maven: wrapper
            optional: false
          - os: ubuntu-latest
            maven: system
            optional: false
          # macOS 目前只作演示与可选验证（见 BuildSpec.md 第 4.1 节）：
          # 不计入必需检查，失败不使整体构建失败。
          - os: macos-latest
            maven: wrapper
            optional: true
    # 可选腿失败只标注该腿自身，不算构建失败
    continue-on-error: ${{ matrix.optional == true }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Build (Wrapper / Maven 4)
        if: matrix.maven == 'wrapper'
        run: ./mvnw clean verify
        shell: bash
      - name: Build (System / Maven 3.9.x)
        if: matrix.maven == 'system'
        run: mvn clean verify
      - name: Compile skill templates
        if: matrix.maven == 'wrapper' && runner.os == 'Linux'
        run: |
          JACKSON=$(find ~/.m2/repository/com/fasterxml/jackson -name 'jackson-annotations-*.jar' | head -1)
          javac -cp "aha-common/target/classes:aha-extension-api/target/classes:aha-core/target/classes:$JACKSON" \
            -d /tmp/skill-templates $(find .agents/skills -name '*.java')

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Markdown fences and links
        run: python3 bin/CheckDocs.py
      - name: Check skills against Agent Skills spec
        run: python3 bin/CheckSkills.py
      - name: Check script encoding and line endings
        run: python3 bin/CheckScripts.py
      - name: Check pixel logo against its generator
        run: python3 bin/GenPixelLogo.py --verify
