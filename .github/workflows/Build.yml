name: Build

# 快速反馈：每次 push / PR 都跑。
#
# 这里**只做快的**——编译 + 单元测试，不采集覆盖率、不打包、不做文档检查。
# 覆盖率门禁、完整 `clean verify`、文档检查与重复率属于慢检查，统一放在
# Gate.yml，只在合入 main 前与发布前跑（见 BuildSpec.md 第 9 节）。
on: [push, pull_request]

jobs:
  build:
    strategy:
      # 不要让一条腿失败就取消其余：Windows 与 Linux 的失败原因常常不同，
      # 早退回会把可用的信息（其余腿的日志）一起丢掉。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            maven: wrapper
          - os: ubuntu-latest
            maven: wrapper
          - os: ubuntu-latest
            maven: system
          # macOS 目前只作演示与可选验证（见 BuildSpec.md 第 4.1 节）：
          # 不计入必需检查，失败不使整体构建失败。
          - os: macos-latest
            maven: wrapper
    # 可选腿失败只标注该腿自身，不算构建失败。
    #
    # 判定依据直接取自 os，**不额外增加矩阵键**：GitHub 会把矩阵的**全部键值**拼进
    # 作业名（多一个 optional 就会变成 build (windows-latest, wrapper, false)），
    # 而分支保护的必需检查是按作业名匹配的——一改名就永远停在 Expected。
    # 【契约】必需腿的作业名与矩阵键变更时必须同步更新分支保护，见 BuildSpec.md 第 8.1 节。
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Test (Wrapper / Maven 4)
        if: matrix.maven == 'wrapper'
        uses: ./.github/actions/maven-run
        with:
          command: ./mvnw -B clean test -Djacoco.skip=true
      - name: Test (System / Maven 3.9.x)
        if: matrix.maven == 'system'
        uses: ./.github/actions/maven-run
        with:
          command: mvn -B clean test -Djacoco.skip=true
      - name: Compile skill templates
        if: matrix.maven == 'wrapper' && runner.os == 'Linux'
        run: |
          JACKSON=$(find ~/.m2/repository/com/fasterxml/jackson -name 'jackson-annotations-*.jar' | head -1)
          javac -cp "aha-common/target/classes:aha-extension-api/target/classes:aha-core/target/classes:$JACKSON" \
            -d /tmp/skill-templates $(find .agents/skills -name '*.java')

  # ── 构建成功后在 main 上自动打 tag ─────────────────────────────────────────
  #
  # 触发时机：**push 到 `main`**（即 `dev` → `main` 的 PR 被合并之后），且上面的 build 已成功。
  #
  # tag 名：`V<项目版本号>`（如 `V0.1.0`）。版本号由唯一读取入口
  #         `.github/Python/ProjectVersion.py` 解析（`version` 文件 → 根 POM 的
  #         `<revision>` → `<version>`，见 TD-00016 §B）；工作流里不写版本字面量——
  #         版本改了 tag 跟着走，不会形成两处口径。
  #
  # 为什么 `needs: build` 就够了：带 `needs` 的作业在依赖失败时会被跳过，不必再判 `result`。
  #         唯一的边角是那条**可选**的 macOS 腿（`continue-on-error`）：若它没通过且影响到了
  #         build 作业的结论，本作业会被跳过——此时按 ReleaseProcess.md 手工补 tag 即可。
  #
  # 【重要】用 `GITHUB_TOKEN` 推的 tag **不会触发下游工作流**（GitHub 防递归的既定行为），
  #         所以 `Release.yml` 不会因这里的 tag 自动开跑。本仓库**不为此配置 PAT**——
  #         发布按 ReleaseProcess.md §4.2 手工重建 tag（由人推送，不受防递归限制）。
  #
  # 【权限】推 tag 需要 `contents: write`。若仓库把 Actions 默认权限设成了只读，
  #         这一步会因权限不足而失败——处置见 BuildSpec.md 第 8.1 节。
  tag:
    name: tag（V<版本号>）
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 读取项目版本（唯一入口：.github/Python/ProjectVersion.py）
        id: version
        run: |
          VERSION=$(python3 .github/Python/ProjectVersion.py --resolve)
          test -n "${VERSION}"
          echo "项目版本：${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: 打 tag 并推送（已存在则跳过）
        env:
          TAG: V${{ steps.version.outputs.version }}
        run: |
          # 幂等：同一版本被重复合入 main 是正常事（例如只改了文档），不该因此报错
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} 已存在，跳过"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "AHA ${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "已创建并推送 tag：${TAG}（指向 ${GITHUB_SHA}）"
