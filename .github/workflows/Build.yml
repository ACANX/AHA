name: Build

# 快速反馈：每次 push / PR 都跑。
#
# 这里**只做快的**——编译 + 单元测试，不采集覆盖率、不打包、不做文档检查。
# 覆盖率门禁、完整 `clean verify`、文档检查与重复率属于慢检查，统一放在
# Gate.yml，只在合入 main 前与发布前跑（见 BuildSpec.md 第 9 节）。
on: [push, pull_request]

jobs:
  build:
    strategy:
      # 不要让一条腿失败就取消其余：Windows 与 Linux 的失败原因常常不同，
      # 早退回会把可用的信息（其余腿的日志）一起丢掉。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            maven: wrapper
          - os: ubuntu-latest
            maven: wrapper
          - os: ubuntu-latest
            maven: system
          # macOS 目前只作演示与可选验证（见 BuildSpec.md 第 4.1 节）：
          # 不计入必需检查，失败不使整体构建失败。
          - os: macos-latest
            maven: wrapper
    # 可选腿失败只标注该腿自身，不算构建失败。
    #
    # 判定依据直接取自 os，**不额外增加矩阵键**：GitHub 会把矩阵的**全部键值**拼进
    # 作业名（多一个 optional 就会变成 build (windows-latest, wrapper, false)），
    # 而分支保护的必需检查是按作业名匹配的——一改名就永远停在 Expected。
    # 【契约】必需腿的作业名与矩阵键变更时必须同步更新分支保护，见 BuildSpec.md 第 8.1 节。
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Test (Wrapper / Maven 4)
        if: matrix.maven == 'wrapper'
        uses: ./.github/actions/maven-run
        with:
          command: ./mvnw -B clean test -Djacoco.skip=true
      - name: Test (System / Maven 3.9.x)
        if: matrix.maven == 'system'
        uses: ./.github/actions/maven-run
        with:
          command: mvn -B clean test -Djacoco.skip=true
      - name: Compile skill templates
        if: matrix.maven == 'wrapper' && runner.os == 'Linux'
        run: |
          JACKSON=$(find ~/.m2/repository/com/fasterxml/jackson -name 'jackson-annotations-*.jar' | head -1)
          javac -cp "aha-common/target/classes:aha-extension-api/target/classes:aha-core/target/classes:$JACKSON" \
            -d /tmp/skill-templates $(find .agents/skills -name '*.java')

  # ── 构建成功后在 main 上自动打 tag ─────────────────────────────────────────
  #
  # 触发时机：**push 到 `main`**（即 `dev` → `main` 的 PR 被合并之后），且上面的 build 已成功。
  #
  # tag 名：`V<项目版本号>`（如 `V0.1.0`）。版本号**唯一来源是父 POM 的 `<version>`**，
  #         工作流里不写版本字面量——版本改了 tag 跟着走，不会形成两处口径。
  #
  # 为什么 `needs: build` 就够了：带 `needs` 的作业在依赖失败时会被跳过，不必再判 `result`。
  #         唯一的边角是那条**可选**的 macOS 腿（`continue-on-error`）：若它没通过且影响到了
  #         build 作业的结论，本作业会被跳过——此时按 ReleaseProcess.md 手工补 tag 即可。
  #
  # 【重要】用 `GITHUB_TOKEN` 推的 tag **不会触发下游工作流**（GitHub 防递归的既定行为），
  #         所以 `Release.yml` 不会因这里的 tag 自动开跑。要让发布自动跟上，有两条路：
  #         改用 PAT 推 tag（存为仓库机密），或 tag 出来后手工触发发布。
  #
  # 【权限】推 tag 需要 `contents: write`。若仓库把 Actions 默认权限设成了只读，
  #         这一步会因权限不足而失败——处置见 BuildSpec.md 第 8.1 节。
  tag:
    name: tag（V<版本号>）
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 读取项目版本（唯一来源：父 POM）
        id: version
        run: |
          VERSION=$(python3 -c 'import xml.etree.ElementTree as ET; ns="{http://maven.apache.org/POM/4.0.0}"; print(ET.parse("pom.xml").getroot().find(ns+"version").text.strip())')
          test -n "${VERSION}"
          echo "项目版本：${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: 打 tag 并推送（已存在则跳过）
        env:
          TAG: V${{ steps.version.outputs.version }}
        run: |
          # 幂等：同一版本被重复合入 main 是正常事（例如只改了文档），不该因此报错
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} 已存在，跳过"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "AHA ${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "已创建并推送 tag：${TAG}（指向 ${GITHUB_SHA}）"

  # ── dev：JVM 构件构建与打包发布（与 tag 平级）─────────────────────────────
  #
  # 补上 JVM 模式缺失的第三条路径：本地构建、发版构建之外，**每次合并到 dev
  # 就出一版可直接运行的便携包**。对应 DesktopNative.yml / CliNative.yml 的
  # native-image / native-publish，但不做原生编译，直接产出 JVM 便携包：
  #
  #   mvn-version        算版本（a.b.c.PPPPP，与原生线同规则，供各腿共用）
  #   build-mvn-artifact 与 tag 平级：构建 aha-desktop 与 aha-cli，上传成品包为 Actions 制品
  #   build-publish      下载制品，汇总发布预发行版
  #
  # 与发版线的关系：正式发版仍由 Release.yml 在 `V*` tag 上产出（版本取根 POM 的
  # project.version）；这里产出的是 dev 预发行，版本用 a.b.c.PPPPP（含 PR 号），
  # tag 命名空间与正式发版区分，且不进入 releases/latest。
  #
  # 与构建快检查的关系：本段只在 push 到 dev 时跑，PR 事件不触发，
  # 因此不会拖慢每次 PR 的反馈（见 BuildSpec.md 第 9 节）。
  mvn-version:
    name: mvn-version
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      base: ${{ steps.compute.outputs.base }}
      pr: ${{ steps.compute.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
      - name: 计算版本（a.b.c.PPPPP）
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 基线唯一来源：根 POM 的 <version>。标签带命名空间，不能写 findtext('version')。
          base=$(python3 -c "import xml.etree.ElementTree as ET; r = ET.parse('pom.xml').getroot(); print(next(e.text for e in r if e.tag.endswith('version')).strip())")

          # PR 号：push 事件没有 PR 号（merge commit 也是普通 push），按提交 SHA 反查一次。
          pr=$(curl -sS --max-time 30 \
                 -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${REPO}/commits/${SHA}/pulls" \
               | python3 -c "import json,sys
          d = json.load(sys.stdin)
          print(d[0]['number'] if isinstance(d, list) and d else '')" 2>/dev/null || true)
          if [ -z "$pr" ]; then
            # 直接 push 到 dev 或 API 限流：不猜假 PR 号，明确记 00000 并告警。
            echo "::warning::没能确定 PR 号（直接 push 或 API 限流），版本里的 PR 段记为 00000"
            pr=0
          fi

          version=$(printf '%s.%05d' "$base" "$pr")
          {
            echo "base=${base}"
            echo "pr=${pr}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          echo "JVM dev 版本 = ${version}（基线 ${base} + PR ${pr}）"
          {
            echo "### JVM dev 版本：\`${version}\`"
            echo ""
            echo "基线 ${base}，来源 PR #${pr}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-mvn-artifact:
    name: build-mvn-artifact-${{ matrix.label }}
    needs: mvn-version
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    strategy:
      # 一条腿失败不取消其余：三个平台的包是并列交付物。
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            upload_cli: true
          - os: windows-latest
            label: windows-x64
            upload_cli: false
          - os: macos-latest
            label: macos-arm64
            upload_cli: false
    runs-on: ${{ matrix.os }}
    # 同一分支同一平台只保留最新一次：dev 上连续合并时，旧的构建没有价值。
    # group 必须带 matrix.label，否则三条腿会互相取消。
    concurrency:
      group: mvn-artifact-${{ github.ref }}-${{ matrix.label }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: 构建 aha-desktop 与 aha-cli（含本平台 OpenJFX 分类器）
        # 会解析依赖，因此走统一入口（清负缓存 + 只对瞬时故障重试）。
        # -Daha.build.version：注入 version.properties 的 build 项，供「关于」/ 启动页显示。
        uses: ./.github/actions/maven-run
        with:
          command: >-
            ./mvnw -B
            -pl aha-desktop,aha-cli -am package
            -DskipTests -Djacoco.skip=true
            -Daha.build.version=${{ needs.mvn-version.outputs.version }}

      - name: 规范桌面端包名（加构建版本与平台标签）
        shell: bash
        env:
          VERSION: ${{ needs.mvn-version.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 用 [0-9] 而不是 *：避免把原生镜像包 aha-desktop-native-*.zip 误当桌面端包
          files=(Dist/aha-desktop-[0-9]*.zip)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::期望恰好 1 个桌面端包，实际 ${#files[@]} 个：${files[*]:-<无>}"
            exit 1
          fi
          # zip 名用的是 project.version（不含构建号），这里改成带构建版本与平台标签，
          # 使 dev 每次构建的产物可区分。
          target="Dist/aha-desktop-${VERSION}-${LABEL}.zip"
          mv -- "${files[0]}" "$target"
          size=$(du -h "$target" | cut -f1)
          jars=$("$JAVA_HOME/bin/jar" tf "$target" | grep -c 'lib/javafx' || true)
          echo "桌面端包：${target}（${size}，含本平台 OpenJFX jar ${jars} 个）"

      - name: 打 CLI 便携包（平台无关，只在一个腿产出）
        if: matrix.upload_cli
        shell: bash
        env:
          VERSION: ${{ needs.mvn-version.outputs.version }}
        run: |
          set -euo pipefail
          test -f Dist/bin/Aha.sh
          test -d Dist/lib
          target="Dist/aha-${VERSION}-cli.zip"
          # 先在临时目录里打，再移进 Dist/：直接往 Dist/ 里写 zip 会把正在写入的自身收进归档。
          (cd Dist && zip -qr "${RUNNER_TEMP}/aha-cli.zip" bin lib README.md LICENSE CHANGELOG.md)
          mv -- "${RUNNER_TEMP}/aha-cli.zip" "$target"
          ls -lh "$target"

      - name: 上传制品（Actions 制品仓库）
        uses: actions/upload-artifact@v7
        with:
          # 桌面端每腿一个平台包；CLI 只在 upload_cli 的腿上传（一份平台无关包）。
          name: Mvn-Artifact-${{ matrix.label }}
          path: |
            Dist/aha-desktop-${{ needs.mvn-version.outputs.version }}-${{ matrix.label }}.zip
            Dist/aha-${{ needs.mvn-version.outputs.version }}-cli.zip
          if-no-files-found: warn
          retention-days: 14

  # ── dev：汇总发布（预发行版）──────────────────────────────────────────────
  #   单作业发布：三条腿并发写同一个 release 会互相打架，
  #   因此先各自上传制品，再由这里一次性挂到发布页。
  build-publish:
    name: build-publish
    needs: [mvn-version, build-mvn-artifact]
    if: always() && needs.mvn-version.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部制品
        # 没有任何制品时下载可能报错——这属于「本次无可发布产物」的正常分支。
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 整理资产（没有产物也算正常，不失败）
        id: collect
        continue-on-error: true
        run: |
          set -uo pipefail
          shopt -s nullglob
          # download-artifact 会把每个制品的 zip 放在自己的子目录里，先收平到 artifacts/ 顶层
          find artifacts -mindepth 2 -name '*.zip' -exec mv -n {} artifacts/ \; 2>/dev/null || true
          files=(artifacts/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "::warning::本次没有任何 JVM 包可发布（各腿结论见各自摘要）"
            {
              echo "### JVM dev：本次无可发布产物"
              echo ""
              echo "三条腿都没有产出可用的包，因此**未创建预发行版**。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          ls -lh "${files[@]}"
          {
            echo "### JVM dev：本次可发布 ${#files[@]} 个包"
            echo ""
            for f in "${files[@]}"; do
              echo "- \`$(basename "$f")\`（$(du -h "$f" | cut -f1)）"
            done
            echo ""
            echo "> 解压即可运行：桌面端需 JDK 25（包内含本平台 OpenJFX）；CLI 包平台无关。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: PreRelease-AHA-JVM
        if: steps.collect.outputs.any == 'true'
        uses: softprops/action-gh-release@v3
        with:
          # tag 带 -aha-jvm 后缀与正式发版（V*）和原生线（-aha-desktop-native / -aha-cli-native）区分。
          tag_name: V${{ needs.mvn-version.outputs.version }}-aha-jvm
          name: V${{ needs.mvn-version.outputs.version }}-AHA-JVM
          prerelease: true
          files: artifacts/*.zip
          body: |
            ## 这是什么

            以 `dev` 分支最新合并的代码构建的 **JVM 便携包**（非原生镜像）：
            解压即可运行，桌面端需本机 JDK 25，CLI 包平台无关。

            > ⚠️ **dev 预发行产物，不是正式发行包。** 正式版本请用 `V<版本号>` 的
            > 发版页面；这里的东西用来「验证 dev 最新合并」。

            ## 版本
            - 本版版本号：`${{ needs.mvn-version.outputs.version }}`
            - 基线版本：`${{ needs.mvn-version.outputs.base }}`（读自根 pom.xml）
            - 来源 PR：#${{ needs.mvn-version.outputs.pr }}

            ## 包含什么
            - `aha-desktop-<版本>-<平台>.zip`：桌面端便携包（`bin/` 启动脚本 + `lib/` 依赖，
              含本平台 OpenJFX 与缺省配置/静态资源，随模块 jar 分发）；
            - `aha-<版本>-cli.zip`：CLI 发行包（`bin/` + `lib/`，平台无关）。

            ## 怎么用
            1. 按你的系统下载对应包；
            2. 解压后运行 `bin/AhaDesktop.bat`（Windows）或 `bin/AhaDesktop.sh`（Linux/macOS），
               CLI 运行 `bin/Aha.bat` / `bin/Aha.sh`；
            3. 配置与数据在 `AHA_HOME`（默认 `~/.aha`）。
