name: SnapshotJVM

# ── 这是什么 ────────────────────────────────────────────────────────────────────
# 特性 / 修复分支的 **JVM 快照出包线**（issue #165）：给未合并的 PR 出一版可下载的
# JVM 便携包，把「自测」提前到合并之前。
#
# ── 触发方式（#165 §三）───────────────────────────────────────────────────────
#   ① 标签（**粘性**）：PR 上打了 `SNAPSHOT:JVMDesktop` / `SNAPSHOT:JVMCli` 就出包，
#      之后每次 push 重出；移除标签即停；没打标签时一类目标都不出。
#      `OS:Win` / `OS:MacOS` / `OS:Ubuntu` 把范围收窄到单平台（不能单独使用）。
#   ② PR 评论命令（一次性）：`/snapshot <target> [os ...]`，大小写不敏感；
#      只有对仓库有写权限的账号发才生效；参数非法 ⇒ 回复用法、**不构建**。
#   ③ workflow_dispatch：给分支手出一版（尚无可查 PR 时用）。
#
# ── 与 BuildJVMArtifacts 的关系 ───────────────────────────────────────────────
# 构建与打包**复用** BuildJVMArtifacts.yml（`workflow_call`），不复制一套：
# 复制出来的第二套必然漂移（本仓库已把这类漂移固化成检查）。
# 载体：**每个目标一条 pre-release**，tag 形如 `V<快照版本>-AHA-<目标>`
# （如 `V0.1.3.00179.10141649-AHA-Desktop-JVM`，发行名与 tag 完全相同）。
# 它落在 `V*` 家族里，因此有两条硬约束：
#   1. `Release.yml` 的 tag 过滤必须排除 `-AHA-*`（已加负向模式），否则每次出快照
#      都会触发一遍完整的正式发版流程；
#   2. 保持 `prerelease: true`（不进 `releases/latest`）。
# 现有原生取件脚本按 `-aha-desktop-native` / `-aha-cli-native` 后缀检索，不受本命名影响。
#
# ── 判定逻辑在哪 ──────────────────────────────────────────────────────────────
# 全部在 `.github/Python/SnapshotPlan.py`（可本地跑 `--self-test`）：
# 标签矩阵、变更分类 A/B/C、版本号（含北京时间戳）、资产名、PR 评论正文。
# 它读取的**单一来源**是 `.github/SnapshotPaths.yml`（触发标签 + A/B/C 路径分组）——
# 本工作流里不写死任何标签名或路径：那些字面量只允许出现在清单里。
# 本文件只做胶水。**不要把判定逻辑写进 YAML 的块标量**——那既跑不快也测不了，
# 本轮已因「块标量里嵌 Python」翻过两次车。

# ── ⚠️ 一条必须知道的 GitHub 行为（实测踩到）──────────────────────────────────
# `issue_comment` 与 `pull_request: closed` 这类事件，用的是**默认分支上**的工作流定义；
# 而 `pull_request`（opened / synchronize / labeled …）用的是**PR 分支上**的定义。
# 后果：
#   * 标签触发：合并前就能用（✅ 实测：本 PR 打 `SNAPSHOT:JVMDesktop` 即出包）；
#   * `/snapshot` 评论命令：**必须等本文件进入默认分支后才生效**（合并前发评论毫无反应——
#     实测：COLLABORATOR 账号发出 `/snapshot Cli Ubuntu`，没有产生任何 run）。
# 因此合并后第一件事就是补一次评论命令的端到端验证（#165 验收 26 的端到端部分）。
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR 号（必填；用于版本号与发布页 tag）
        required: true
      target:
        description: 目标（Desktop-JVM / Cli-JVM）
        required: false
        default: Desktop-JVM
      os:
        description: 平台限定（Win / MacOS / Ubuntu；留空 = 该目标全部平台）
        required: false
        default: ''

permissions:
  contents: write        # 建发布页 pre-release `snapshot-pr<N>`
  pull-requests: write   # 回写 PR 汇总评论
  issues: write

# 同一 PR 只留最新一次：连续 push 时旧快照没有价值（#165 §三「并发组取消旧 run」）。
#
# 【为什么把「显式请求」单独分一组（2026-10-15 实测 PR #203）】
# 只按 PR 号分组时，`pull_request` 的 `labeled` 与 `synchronize` 落在**同一组**，
# `cancel-in-progress` 会让后到的 `synchronize` 取消先到的 `labeled` ——
# 「打完触发标签紧接着 push / 同步 base」正是这么踩的（PR #203：03:07:45 打的标签，
# run 在 03:07:47 建立，随后被 03:08:04 的 synchronize run 取消）。
# 现在按**事件类别**分两组：
#   * `explicit`：labeled / unlabeled / issue_comment / workflow_dispatch（用户显式动作）；
#   * `auto`：opened / synchronize / reopened（自动事件）。
# 两组互不取消；各自组内仍只保留最新一次（连续 push 依旧只跑最后一条）。
# 【写法注意】GitHub Actions 表达式**没有三元运算符** `? :` —— 用 `cond && 'explicit' || 'auto'`
# 模拟（写成 `? :` 会让工作流在**校验阶段**直接失效：报「workflow file issue」，且不产生任何日志）。
concurrency:
  group: >-
    snapshot-jvm-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.ref }}-${{
    ((github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled')) || github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch') && 'explicit' || 'auto' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ── 1. 判定：该不该出、出哪几个目标与平台、版本号、评论正文 ───────────────────
  Plan:
    name: Plan
    runs-on: ubuntu-latest
    # 评论触发的：只认 `/snapshot` 开头的评论，其它评论一律不理会（否则每条评论都起一次 run）。
    # 排除 `/snapshot-assert*`（快照自测留痕，issue #166）：它是 `/snapshot` 前缀，但由
    # SnapshotAssert.yml 负责；不排除的话，这条命令会让本工作流回一条
    # 「命令格式应为 `/snapshot <target> [os ...]`」（误导性回复 + 一次空跑）。
    if: >-
      github.event_name != 'issue_comment'
      || (github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/snapshot')
          && !startsWith(github.event.comment.body, '/snapshot-assert'))
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      pr: ${{ steps.plan.outputs.pr }}
      version: ${{ steps.plan.outputs.version }}
      targets: ${{ steps.plan.outputs.targets }}
      matrix: ${{ steps.plan.outputs.matrix }}
      releases: ${{ steps.plan.outputs.releases }}
      # 纯原生目标时本工作流不认领评论（否则会把 JVM 线的快照评论覆盖成「未出包」），
      # 原生线将来用自己的标记维护自己的评论（见 S4 / #172）。
      owns_comment: ${{ steps.plan.outputs.owns_comment }}
      comment: ${{ steps.plan.outputs.comment }}
    steps:
      - uses: actions/checkout@v7

      - name: ResolvePullRequestNumber
        id: pr
        env:
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            pull_request) pr="${EVENT_PR}" ;;
            issue_comment) pr="${EVENT_ISSUE}" ;;
            *) pr="${INPUT_PR}" ;;
          esac
          if [ -z "${pr}" ]; then
            echo "::error::没能确定 PR 号（workflow_dispatch 需要显式传 pr）"
            exit 1
          fi
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          echo "PR #${pr}"

      - name: FetchChangedFiles
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/pulls/${{ steps.pr.outputs.pr }}/files" \
            --jq '.[].filename' > changed-files.txt || true
          echo "改动文件数：$(wc -l < changed-files.txt)"
          head -5 changed-files.txt || true

      - name: RunSnapshotPlan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          COMMENT: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_OS: ${{ inputs.os }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.pr }}"
          baseline=$(python3 .github/Python/ProjectVersion.py --resolve)
          # `pr` 与 `owns_comment` 在**任何分支**都要产出：评论作业的门是
          # `pr != '' && owns_comment != 'false'`；早先只有成功分支写了 pr，
          # 于是「非法命令 ⇒ 回复用法」这条路径**根本不会回写评论**（真机实测抓到）。
          echo "pr=${pr}" >> "$GITHUB_OUTPUT"
          # `owns_comment` 不在这里写：判定脚本给出 false（纯原生目标）时必须生效 ⇒ 由各分支显式写
          # 评论正文一律由脚本生成（含「未构建」说明）——YAML 里只出现单行调用，
          # 避免多行字符串在块标量里被提前截断（本文件曾因此写坏三次）。
          # 注意：多行输出必须用 heredoc 形式（`name<<EOF` … `EOF`）；直接 `comment=多行`
          # 会让 GitHub 报 `Invalid format`（实测踩过）。
          emit_notice() {
            printf 'comment<<AHA_SNAPSHOT_EOF\n' >> "$GITHUB_OUTPUT"
            python3 .github/Python/SnapshotPlan.py --notice "$1" >> "$GITHUB_OUTPUT"
            printf 'AHA_SNAPSHOT_EOF\n' >> "$GITHUB_OUTPUT"
          }

          # 评论命令 / 手动触发：归一成一条规范命令串交给判定脚本
          command="${COMMENT}"
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            command="/snapshot ${INPUT_TARGET:-Desktop-JVM} ${INPUT_OS:-}"
          fi
          extra=()
          # 只有「新打标签」这一动作算显式请求（只改文档时也照出，见 #165 验收 16）
          if [ "${EVENT}" = "pull_request" ] && [ "${{ github.event.action }}" = "labeled" ]; then
            extra+=(--label-event)
          fi

          # 权限：/snapshot 只对仓库有写权限的账号生效（其他人发 ⇒ 回复说明、不构建）
          if [ "${EVENT}" = "issue_comment" ]; then
            case "${ASSOCIATION}" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *)
                echo "should_build=false" >> "$GITHUB_OUTPUT"
                echo "owns_comment=true" >> "$GITHUB_OUTPUT"
                # 注意：**不能**用反引号包 `/snapshot` —— 双引号内反引号会被 bash 当命令替换执行（实测报 `/snapshot\: No such file or directory`）
                echo "owns_comment=true" >> "$GITHUB_OUTPUT"
                emit_notice "/snapshot 命令只对**本仓库有写权限**的账号生效（当前账号关联：${ASSOCIATION:-NONE}）"
                exit 0
                ;;
            esac
          fi

          set +e
          json=$(python3 .github/Python/SnapshotPlan.py \
                   --labels "${LABELS}" --changed-files changed-files.txt \
                   --baseline "${baseline}" --pr "${pr}" --command "${command}" \
                   "${extra[@]}" --json 2>plan.err)
          code=$?
          set -e
          if [ "${code}" -ne 0 ]; then
            # 参数非法 ⇒ 回复用法、不构建（#165 验收 26）
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "owns_comment=true" >> "$GITHUB_OUTPUT"
            emit_notice "$(head -1 plan.err)"
            exit 0
          fi

          {
            echo "should_build=$(echo "$json" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["should_build"]).lower())')"
            echo "version=$(echo "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
            echo "targets=$(echo "$json" | python3 -c 'import json,sys; print(",".join(json.load(sys.stdin)["targets"]))')"
            echo "matrix=$(echo "$json" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["matrix"], separators=(",",":")))')"
            echo "releases=$(echo "$json" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["releases"], separators=(",",":")))')"
            echo "owns_comment=$(echo "$json" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("owns_comment", True)).lower())')"
          } >> "$GITHUB_OUTPUT"
          # 评论正文多行 ⇒ 必须 heredoc 形式（见上）
          printf 'comment<<AHA_SNAPSHOT_EOF\n' >> "$GITHUB_OUTPUT"
          python3 .github/Python/SnapshotPlan.py \
            --labels "${LABELS}" --changed-files changed-files.txt \
            --baseline "${baseline}" --pr "${pr}" --command "${command}" \
            "${extra[@]}" --run-url "${RUN_URL}" --comment >> "$GITHUB_OUTPUT"
          printf 'AHA_SNAPSHOT_EOF\n' >> "$GITHUB_OUTPUT"

          echo "判定完成：${json}"
          {
            echo "### 快照判定"
            echo ""
            echo "- 是否出包：${should_build:-见上}"
            echo "- 版本：$(echo "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
            echo "- 依据：$(echo "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reason"])')"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 2. 构建与打包：复用 dev 线的实现（不复制一套）────────────────────────────
  Build:
    name: Build
    needs: Plan
    if: needs.Plan.outputs.should_build == 'true'
    uses: ./.github/workflows/BuildJVMArtifacts.yml
    with:
      pr: ${{ needs.Plan.outputs.pr }}
      version: ${{ needs.Plan.outputs.version }}
      matrix: ${{ needs.Plan.outputs.matrix }}
      # 载体由本工作流决定（挂 snapshot-pr<N>），因此让 dev 线那边**不要**发布。
      publish: false

  # ── 3. 发布到 pre-release `snapshot-pr<N>`（#165 §七 路线 A）────────────────
  Publish:
    name: Publish
    needs:
      - Plan
      - Build
    # `always()` 是为了「上游失败也让 publish 跑一次以给出明确结论」；
    # 但**被并发取消**的 run 必须排除：取消时发布只会留下半成品，且会把 PR 检查染红
    # （实测：连续 push + 改标签让前一个 run 被取消，publish/comment 因 always() 启动后被取消，
    #  在 PR 上显示为失败）。因此统一加 `!cancelled()`。
    if: >-
      always() && !cancelled()
      && needs.Plan.outputs.should_build == 'true' && needs.Build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: DownloadArtifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: NormalizeAssetNames
        id: rename
        env:
          VERSION: ${{ needs.Plan.outputs.version }}
          TARGETS: ${{ needs.Plan.outputs.targets }}
        run: |
          set -euo pipefail
          # 收平到 artifacts/ 顶层（用 -f 覆盖，避免同名时 `mv -n` 静默跳过）
          find artifacts -mindepth 2 -name '*.zip' -exec cp -f {} artifacts/ \; 2>/dev/null || true
          echo "下载到的资产："
          ls -1 artifacts/*.zip 2>/dev/null | sed 's/^/  /' || true
          # 兼容旧名（旧版上游只给 aha-desktop-<版本>-<平台>.zip）
          for f in artifacts/aha-desktop-[0-9]*.zip; do
            [ -e "$f" ] || continue
            label=$(basename "$f" | sed -E 's/^aha-desktop-[0-9.]+-([a-z0-9-]+)\.zip$/\1/')
            mv "$f" "artifacts/aha-desktop-jvm-${VERSION}-${label}-jdk25.zip"
          done
          # 兼容旧名（旧版上游只给 aha-cli-<版本>.zip，平台无关）
          for f in artifacts/aha-cli-[0-9]*.zip; do
            [ -e "$f" ] || continue
            mv "$f" "artifacts/aha-cli-jvm-${VERSION}-ubuntu-amd64-jdk25.zip"
          done
          # CLI-JVM 自 issue #269 起由三条 jdk25 腿各自产出，这里不再复制同内容的三份。
          # 计数：任何非报告包的 zip（不依赖前缀——前缀改过一次，按前缀计数会静默归零）
          count=0
          for f in artifacts/*.zip; do
            [ -e "$f" ] || continue
            case "$(basename "$f")" in
              *-report.zip|*-Report.zip) continue ;;
            esac
            count=$((count + 1))
          done
          echo "整理出 ${count} 个资产："
          ls -1 artifacts/*.zip | sed 's/^/  /'
          if [ "${count}" -eq 0 ]; then
            echo "::error::没有可发布的快照资产（构建腿可能都失败了）"
            exit 1
          fi

      - name: UpsertPreRelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.Plan.outputs.pr }}
          VERSION: ${{ needs.Plan.outputs.version }}
          RELEASES: ${{ needs.Plan.outputs.releases }}
        run: |
          set -euo pipefail
          # 判定脚本已给出「每个目标一条 tag」的清单（含该目标应有的资产名）。
          # 一条目标一个 pre-release：一次运行同时选中 Desktop-JVM 与 Cli-JVM 时会得到两条并列的发布页。
          python3 -c 'import json,os; [print("\t".join([g["tag"], g["name"], ",".join(g["assets"])])) for g in json.loads(os.environ["RELEASES"])]' > "$RUNNER_TEMP/groups.tsv"
          cat "$RUNNER_TEMP/groups.tsv"
          while IFS=$'\t' read -r tag name assets; do
            [ -z "${tag:-}" ] && continue
            notes="PR #${PR} 的快照包（版本 ${VERSION}，7 天有效，非正式发行）。取件：Dist\\UpdateSnapshot.ps1 -Kind jvm -Pr ${PR}"
            if gh release view "${tag}" --repo "${REPO}" > /dev/null 2>&1; then
              gh release edit "${tag}" --repo "${REPO}" --title "${name}" --notes "${notes}" --prerelease > /dev/null
              echo "已更新发布页：${tag}"
            else
              gh release create "${tag}" --repo "${REPO}" --title "${name}" --notes "${notes}" --prerelease > /dev/null
              echo "已创建发布页：${tag}"
            fi
            IFS=',' read -ra wanted <<< "${assets}"
            for asset in "${wanted[@]}"; do
              if [ -f "artifacts/${asset}" ]; then
                gh release upload "${tag}" "artifacts/${asset}" --repo "${REPO}" --clobber > /dev/null
                echo "  已上传 ${asset}"
              else
                echo "::warning::清单里的资产不存在，跳过：${asset}"
              fi
            done
          done < "$RUNNER_TEMP/groups.tsv"

  # ── 4. 回写 PR 评论（**幂等**：同一条评论反复编辑，见 #165 §六）──────────────
  Comment:
    name: Comment
    needs:
      - Plan
      - Publish
    # 即使构建失败也要回写（评论要能反映「本次没出包 / 失败了」）；没有 PR 号则无事可做。
    # `!cancelled()`：被并发取消的 run 不回写（否则会把 PR 检查染红，且评论内容是过期的）。
    if: >-
      always() && !cancelled() && needs.Plan.outputs.pr != ''
      && needs.Plan.outputs.owns_comment != 'false'
    runs-on: ubuntu-latest
    steps:
      # 要跑仓库里的脚本，先检出（评论作业此前不需要工作区，现在需要）。
      - uses: actions/checkout@v7

      - name: UpsertPullRequestComment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.Plan.outputs.pr }}
          MARKER: <!-- aha-snapshot -->
          BODY: ${{ needs.Plan.outputs.comment }}
        run: |
          set -euo pipefail
          # 定位「自己那条」评论（按标记）→ 有就 PATCH、没有就 POST；503/429/超时**有界重试**。
          # 这些逻辑放在脚本里：此前三条工作流各抄一份 shell，同一个缺陷要修三遍
          # （本轮修了两次：`gh api --jq --arg`、缺 `issues: write`），且一次 API 503 就让 PR 变红。
          printf '%s\n' "${BODY}" | python3 .github/Python/SnapshotComment.py \
            --repo "${REPO}" --pr "${PR}" --marker "${MARKER}"
