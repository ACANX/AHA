name: Release

on:
  push:
    tags:
      # 打 tag 的约定是 `V<版本号>`（大写 V，如 `V0.1.0`，见 Build.yml 的 tag 作业）。
      # ref 过滤是大小写敏感的，两种都列上，手工用 `v0.1.0` 或 `V0.1.0` 都能触发。
      - 'V*'
      - 'v*'

permissions:
  contents: write

jobs:
  # 发布前先过同一道门禁（verify + 覆盖率 + 文档 + 技能 + 脚本 + 重复率）。
  # 它同时是「合入 main」的卡点，发布因此不需要另一套检查。
  gate:
    uses: ./.github/workflows/Gate.yml

  # 兼容性验证（Maven 3.9.x）同样是发布前置：发行包必须在兼容基线上也能构建。
  compat:
    uses: ./.github/workflows/Compat.yml

  # ── CLI 发行包（平台无关） ────────────────────────────────────────────────
  # 纯 JAR 组合，sqlite-jdbc 的多平台原生库随它自己的 jar 走，因此一份包通吃所有平台，
  # 不需要按平台出包。
  release:
    name: CLI 发行包
    needs: [gate, compat]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Build and verify
        # 有意重跑一次：发行包必须由「自身跑过门禁的构建」产出，
        # 不复用 gate 另一个 runner 上的产物（跨 job 传产物只会让链路更难查）。
        uses: ./.github/actions/maven-run
        with:
          command: ./mvnw clean verify
      - name: Package CLI distribution
        shell: bash
        run: |
          set -euo pipefail
          test -f Dist/bin/Aha.sh
          test -d Dist/lib
          # 版本从产物名读，作为唯一来源（不复制版本字面量）
          cli_jar=$(ls Dist/lib/aha-cli-*.jar)
          version=$(basename "$cli_jar" .jar)
          version=${version#aha-cli-}
          target="aha-cli-${version}.zip"
          # 先在临时目录里打，再移进 Dist/：
          #   * 直接在 Dist/ 里写 zip，会把正在写入的自身也收进归档；
          #   * 只列 bin/ lib/ 与三个文档，将来 Dist/ 里再放别的产物也不会被误收。
          (cd Dist && zip -qr "${RUNNER_TEMP}/${target}" bin lib README.md LICENSE CHANGELOG.md)
          mv -- "${RUNNER_TEMP}/${target}" Dist/
          # 产物统一落 Dist/：仓库根只放源码与文档
          ls -lh "Dist/${target}"
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: Dist/aha-cli-*.zip

  # ── 桌面端：按平台出包（每个 runner 只能产出自己平台的包） ────────────────
  desktop:
    name: 桌面端包（${{ matrix.label }}）
    needs: [gate, compat]
    strategy:
      # 一条腿失败不要取消其余：三个平台的包是并列的交付物，缺哪一个都要看得见。
      fail-fast: false
      matrix:
        # JavaFX 原生库按平台分类器发布
        # （见 DesktopDesign.md 第 5 节），所以每个平台只能由自己的 runner 产出。
        #
        # `label` 同时是作业名与下载文件名的组成部分，供用户辨认
        # 「操作系统 + 架构」；`expected` 是本腿**应当**解析出的平台分类器，
        # 构建后由包名与依赖树双向自证——若 GitHub 改了 runner 的架构
        # （例如 macos-latest 换架构），这里会直接失败，而不是把错平台的包
        # 静静挂到 release 页面。
        include:
          - os: ubuntu-latest
            label: linux-x64
            expected: linux
          - os: windows-latest
            label: windows-x64
            expected: win
          - os: macos-latest
            label: macos-arm64
            expected: mac-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Build and verify
        # 同 CLI 作业：发行包必须由自身跑过门禁的构建产出。
        uses: ./.github/actions/maven-run
        with:
          command: ./mvnw clean verify

      - name: 自证平台分类器（包名 → 下载文件名）
        shell: bash
        env:
          EXPECTED: ${{ matrix.expected }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 用 [0-9] 而不是 *：这样不会把 Dist/ 里可能存在的
          # aha-desktop-native-<版本>-<jdk>.zip（原生镜像包）误当成桌面端 jar 包。
          files=(Dist/aha-desktop-[0-9]*.zip)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::期望恰好 1 个桌面端包，实际 ${#files[@]} 个：${files[*]:-<无>}"
            exit 1
          fi
          # 文件名形如 Dist/aha-desktop-<版本>-<平台分类器>.zip，先去掉目录前缀
          rest="${files[0]#Dist/}"
          rest="${rest#aha-desktop-}"; rest="${rest%.zip}"

          # 分类器名里可能含 '-'（mac-aarch64 / linux-aarch64），
          # 故先匹配更具体的，再匹配短的。
          classifier=""
          for c in linux-aarch64 mac-aarch64 win linux mac; do
            case "$rest" in
              *-"$c") classifier="$c"; version="${rest%-$c}"; break ;;
            esac
          done
          if [ -z "$classifier" ]; then
            echo "::error::无法从包名解析平台分类器：$rest"
            exit 1
          fi

          echo "包名解析：版本=$version 分类器=$classifier"
          if [ "$classifier" != "$EXPECTED" ]; then
            echo "::error::平台不匹配：本腿（${LABEL}）期望 ${EXPECTED}，实际解析到 ${classifier}。"
            echo "::error::runner 架构可能已变更，请核对本文件的 matrix。"
            exit 1
          fi

          target="Dist/aha-desktop-${version}-${LABEL}.zip"
          mv -- "${files[0]}" "$target"
          size=$(du -h "$target" | cut -f1)
          jars=$("$JAVA_HOME/bin/jar" tf "$target" | grep -c '^lib/javafx' || true)
          echo "发布产物：${target}（${size}，含本平台 OpenJFX jar $jars 个）"

      - name: 便携包完整性自证（模块图 + 关键文件）
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 用「一个不存在的主类」触发模块图解析：
          #   - 依赖齐全 → 只会报 “Could not find or load main class …__CompletenessProbe__”
          #   - 缺依赖   → 启动阶段就报 FindException（模块未找到）
          # 实测 `java --validate-modules` **不能**当这个判据：抽掉 aha-core 后它照样退出 0、
          # 一字不说（已在本地做过反向对照）。
          zip_path="$(pwd)/$(ls Dist/aha-desktop-[0-9]*.zip)"
          tmp=$(mktemp -d)
          (cd "$tmp" && "$JAVA_HOME/bin/jar" xf "$zip_path")

          n_jfx=$(ls "$tmp"/lib/javafx-*.jar | wc -l)
          if [ "$n_jfx" -ne 3 ]; then
            echo "::error::期望 3 个本平台 OpenJFX jar，实际 $n_jfx 个"
            exit 1
          fi
          ls "$tmp"/lib/aha-desktop-*.jar >/dev/null
          test -f "$tmp/bin/AhaDesktop.sh"
          test -f "$tmp/bin/AhaDesktop.bat"

          out=$("$JAVA_HOME/bin/java" --module-path "$tmp/lib" \
                --module com.acanx.module.aha.desktop/com.acanx.module.aha.desktop.__CompletenessProbe__ 2>&1 || true)
          if grep -q FindException <<<"$out"; then
            echo "::error::便携包模块图不完整（缺依赖）：$out"
            exit 1
          fi
          echo "模块图完整（${out}）"
          echo "包内：本平台 OpenJFX $n_jfx 个，lib/ 共 $(ls "$tmp"/lib/*.jar | wc -l) 个 jar"

      - name: 打印本平台解析到的 OpenJFX 工件（自证）
        shell: bash
        run: ./mvnw -B -pl aha-desktop dependency:tree -Dincludes=org.openjfx

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: Dist/aha-desktop-[0-9]*.zip
