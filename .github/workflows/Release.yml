name: Release

on:
  push:
    tags:
      # 打 tag 的约定是 `V<版本号>`（大写 V，如 `V0.1.0`，见 Build.yml 的 tag 作业）。
      # ref 过滤是大小写敏感的，两种都列上，手工用 `v0.1.0` 或 `V0.1.0` 都能触发。
      - 'V*'
      - 'v*'
      # 快照包也落在 `V*` 家族（`V<版本>-AHA-<目标>-SNAPSHOT`，见 SnapshotJVM.yml 与 issue #165），
      # 但**绝不能**触发正式发版流程：负向模式按顺序在后，把 `-SNAPSHOT` 排除掉。
      # 实测风险：不加这两行时，每次出快照都会跑一遍完整的正式发版流程。
      - '!V*-SNAPSHOT'
      - '!v*-SNAPSHOT'
      # 2026-10-17 起快照 tag 去掉了 `-SNAPSHOT` 后缀（`V<5 段>-AHA-<product>-<form>`），
      # 5 段版本已能区分快照；这里按 `-AHA-` / `-aha-` 排除，避免快照触发正式发版。
      - '!V*-AHA-*'
      - '!v*-AHA-*'
      - '!V*-aha-*'
      - '!v*-aha-*'

  # 自动打的 tag 由 `GITHUB_TOKEN` 推送，**不会**触发上面的 `push: tags`（GitHub 防递归）。
  # 但 `workflow_dispatch` 是该规则的**官方例外**：`Build.yml` 的 tag 作业在成功打完 tag 后，
  # 用 `gh workflow run Release.yml --ref main -f tag=<TAG>` 把本工作流派发起来（issue #238）。
  #
  # 【为什么必须带 `--ref main`】`workflow_dispatch` 的 `GITHUB_SHA` 是**所派发 ref 的最新提交**，
  # 用默认分支（`dev`）派发会让整个 run 落在 dev 上——`gate` / `compat` 与两条出包线的 checkout
  # 都会取到 dev，与「发行包必须由自身跑过门禁的构建产出」冲突。带 `--ref main` 后
  # `GITHUB_SHA` = `main` head = tag 指向的提交，各处 checkout 默认即正确。
  #
  # 【发布 tag 怎么取】下面统一写 `inputs.tag || github.ref_name`：`push` 事件走 `ref_name`
  # （就是 tag），派发走入参。用 `||` 而**不是** `!= ''` 之类的比较——GitHub 表达式对不同类型
  # 做宽松比较时会折算成数字（`null` / `''` / `false` 都折算为 0），`push` 事件下 `inputs`
  # 整个不存在，那类写法会静默给出错误结论（issue #213 的实测教训）。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 V0.1.3）；`Build.yml` 自动派发时传入'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 发布前先过同一道门禁（verify + 覆盖率 + 文档 + 技能 + 脚本 + 重复率）。
  # 它同时是「合入 main」的卡点，发布因此不需要另一套检查。
  Gate:
    uses: ./.github/workflows/Gate.yml

  # 兼容性验证（Maven 3.9.x）同样是发布前置：发行包必须在兼容基线上也能构建。
  Compat:
    uses: ./.github/workflows/Compat.yml

  # ── CLI-JVM：按平台各出一份（issue #269）────────────────────────────────
  #   三条腿各自在对应 runner 上构建与打包，资产名里的平台段对应真实产物；
  #   逻辑抽到 `CliReleasePackageLeg.yml`，主工作流只留「选哪条腿」。
  CliReleasePackageUbuntuAmd64:
    name: CliReleasePackageUbuntuAmd64
    needs: [Gate, Compat]
    uses: ./.github/workflows/CliReleasePackageLeg.yml
    with:
      os: ubuntu-latest
      label: ubuntu-amd64
      ref: ${{ inputs.tag || github.ref_name }}

  CliReleasePackageWindowsAmd64:
    name: CliReleasePackageWindowsAmd64
    needs: [Gate, Compat]
    uses: ./.github/workflows/CliReleasePackageLeg.yml
    with:
      os: windows-latest
      label: windows-amd64
      ref: ${{ inputs.tag || github.ref_name }}

  CliReleasePackageMacOSAarch64:
    name: CliReleasePackageMacOSAarch64
    needs: [Gate, Compat]
    uses: ./.github/workflows/CliReleasePackageLeg.yml
    with:
      os: macos-latest
      label: macos-aarch64
      ref: ${{ inputs.tag || github.ref_name }}

  # ── 桌面端：按平台出包（每个 runner 只能产出自己平台的包） ────────────────
  # 【为什么是三个静态作业，而不是矩阵】（issue #287）
  #   作业的 `name` 必须是静态字符串（不许 `${{ … }}`、标点、中文），矩阵只能靠表达式区分腿。
  #   逐平台作业 + 共用 `DesktopPackageLeg.yml`：逻辑一份，名字全静态。
  #
  #   `label` 同时是下载文件名的组成部分，供用户辨认「操作系统 + 架构」；
  #   `expected` 是本腿**应当**解析出的平台分类器，构建后由包名与依赖树双向自证——
  #   若 GitHub 改了 runner 的架构（例如 macos-latest 换架构），这里会直接失败，
  #   而不是把错平台的包静静挂到 release 页面。
  DesktopPackageUbuntuAmd64:
    name: DesktopPackageUbuntuAmd64
    needs:
      - Gate
      - Compat
    uses: ./.github/workflows/DesktopPackageLeg.yml
    with:
      os: ubuntu-latest
      label: ubuntu-amd64
      expected: linux
      ref: ${{ inputs.tag || github.ref_name }}

  DesktopPackageWindowsAmd64:
    name: DesktopPackageWindowsAmd64
    needs:
      - Gate
      - Compat
    uses: ./.github/workflows/DesktopPackageLeg.yml
    with:
      os: windows-latest
      label: windows-amd64
      expected: win
      ref: ${{ inputs.tag || github.ref_name }}

  DesktopPackageMacOSAarch64:
    name: DesktopPackageMacOSAarch64
    needs:
      - Gate
      - Compat
    uses: ./.github/workflows/DesktopPackageLeg.yml
    with:
      os: macos-latest
      label: macos-aarch64
      expected: mac-aarch64
      ref: ${{ inputs.tag || github.ref_name }}

  # ── 版本号：原生腿需要「0.1.4」而不是 tag 「V0.1.4」 ─────────────────────
  ResolveVersion:
    name: ResolveVersion
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: ReadVersion
        id: version
        run: echo "version=$(python3 .github/Python/ProjectVersion.py --resolve)" >> "$GITHUB_OUTPUT"

  # ── 原生线：Stable 自 0.1.4 起也出原生包（issue #269）───────────────────────
  #   每条腿复用快照线同一份可复用工作流（`NativeImageLeg.yml` / `CliNativeImageLeg.yml`），
  #   逻辑只有一份；这里只负责「传对版本与平台」。
  DesktopNativeUbuntuAmd64:
    name: DesktopNativeUbuntuAmd64
    needs: [Gate, Compat, ResolveVersion]
    uses: ./.github/workflows/NativeImageLeg.yml
    with:
      os: ubuntu-latest
      label: ubuntu-amd64
      platform: ubuntu
      jdk: '25'
      aha_version: ${{ needs.ResolveVersion.outputs.version }}

  DesktopNativeWindowsAmd64:
    name: DesktopNativeWindowsAmd64
    needs: [Gate, Compat, ResolveVersion]
    uses: ./.github/workflows/NativeImageLeg.yml
    with:
      os: windows-latest
      label: windows-amd64
      platform: win
      jdk: '25'
      aha_version: ${{ needs.ResolveVersion.outputs.version }}

  DesktopNativeMacOSAarch64:
    name: DesktopNativeMacOSAarch64
    needs: [Gate, Compat, ResolveVersion]
    uses: ./.github/workflows/NativeImageLeg.yml
    with:
      os: macos-latest
      label: macos-aarch64
      platform: mac-aarch64
      jdk: '25'
      aha_version: ${{ needs.ResolveVersion.outputs.version }}

  CliNativeUbuntuAmd64:
    name: CliNativeUbuntuAmd64
    needs: [Gate, Compat, ResolveVersion]
    uses: ./.github/workflows/CliNativeImageLeg.yml
    with:
      os: ubuntu-latest
      label: ubuntu-amd64
      platform: ubuntu
      jdk: '25'
      aha_version: ${{ needs.ResolveVersion.outputs.version }}

  CliNativeWindowsAmd64:
    name: CliNativeWindowsAmd64
    needs: [Gate, Compat, ResolveVersion]
    uses: ./.github/workflows/CliNativeImageLeg.yml
    with:
      os: windows-latest
      label: windows-amd64
      platform: win
      jdk: '25'
      aha_version: ${{ needs.ResolveVersion.outputs.version }}

  CliNativeMacOSAarch64:
    name: CliNativeMacOSAarch64
    needs: [Gate, Compat, ResolveVersion]
    uses: ./.github/workflows/CliNativeImageLeg.yml
    with:
      os: macos-latest
      label: macos-aarch64
      platform: mac-aarch64
      jdk: '25'
      aha_version: ${{ needs.ResolveVersion.outputs.version }}

  # 原生腿只上传 Actions 制品，不直接发版（与快照线同一套 legs）；这里统一挂到发布页。
  NativePublish:
    name: NativePublish
    needs:
      - ResolveVersion
      - DesktopNativeUbuntuAmd64
      - DesktopNativeWindowsAmd64
      - DesktopNativeMacOSAarch64
      - CliNativeUbuntuAmd64
      - CliNativeWindowsAmd64
      - CliNativeMacOSAarch64
    # 部分腿失败也要发布已成功的那些（原生编译是可选管线，见 NativeImageLeg 的容错说明）。
    if: always() && needs.ResolveVersion.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: DownloadNativeArtifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: UploadNativeAssets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # download-artifact 把每个制品的 zip 放在自己的子目录里，先收平到 artifacts/ 顶层。
          find artifacts -mindepth 2 -name '*.zip' -exec mv -n {} artifacts/ \; 2>/dev/null || true
          files=(artifacts/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "⚠️ 本次没有原生包可发布（各腿可能未编出二进制）"
            exit 0
          fi
          gh release upload "${TAG}" "${files[@]}" --clobber
          echo "已上传 ${#files[@]} 个原生包"

      - name: SummarizeNativeLegs
        # 原生腿是 job 级 `continue-on-error`（整条管线可选），腿失败不会让 workflow 变红。
        # 代价是「workflow 绿」掩盖了「交付物缺失」——V0.1.4 就是这样连续失败多次没人发现（#303）。
        # 这里把 6 条腿的真实结果摊到 Job Summary，缺哪个形态 × 平台一眼可见。
        if: always()
        shell: bash
        env:
          DESKTOP_WINDOWS: ${{ needs.DesktopNativeWindowsAmd64.result }}
          DESKTOP_UBUNTU: ${{ needs.DesktopNativeUbuntuAmd64.result }}
          DESKTOP_MACOS: ${{ needs.DesktopNativeMacOSAarch64.result }}
          CLI_WINDOWS: ${{ needs.CliNativeWindowsAmd64.result }}
          CLI_UBUNTU: ${{ needs.CliNativeUbuntuAmd64.result }}
          CLI_MACOS: ${{ needs.CliNativeMacOSAarch64.result }}
        run: |
          set -euo pipefail
          {
            echo "### 原生腿结果（continue-on-error，不等于交付成功）"
            echo
            echo "| 形态 | 平台 | 结果 |"
            echo "|---|---|---|"
            echo "| desktop-native | windows-amd64 | ${DESKTOP_WINDOWS} |"
            echo "| desktop-native | ubuntu-amd64 | ${DESKTOP_UBUNTU} |"
            echo "| desktop-native | macos-aarch64 | ${DESKTOP_MACOS} |"
            echo "| cli-native | windows-amd64 | ${CLI_WINDOWS} |"
            echo "| cli-native | ubuntu-amd64 | ${CLI_UBUNTU} |"
            echo "| cli-native | macos-aarch64 | ${CLI_MACOS} |"
            echo
            echo "> 失败或跳过的腿 = 本版缺对应主包；`Checksums` 作业会据此判定发布是否完整。"
          } >> "${GITHUB_STEP_SUMMARY}"

          failed=0
          for row in "desktop-native/windows-amd64:${DESKTOP_WINDOWS}" \
                     "desktop-native/ubuntu-amd64:${DESKTOP_UBUNTU}" \
                     "desktop-native/macos-aarch64:${DESKTOP_MACOS}" \
                     "cli-native/windows-amd64:${CLI_WINDOWS}" \
                     "cli-native/ubuntu-amd64:${CLI_UBUNTU}" \
                     "cli-native/macos-aarch64:${CLI_MACOS}"; do
            name="${row%%:*}"; result="${row##*:}"
            if [ "${result}" != "success" ]; then
              echo "::warning::原生包缺失：${name}（腿结果 ${result}）"
              failed=$((failed + 1))
            fi
          done
          if [ "${failed}" -gt 0 ]; then
            echo "⚠️ ${failed} 条原生腿未产出交付物"
          else
            echo "✅ 6 条原生腿全部产出"
          fi

  Checksums:
    name: ReleaseChecksum
    needs:
      - CliReleasePackageUbuntuAmd64
      - CliReleasePackageWindowsAmd64
      - CliReleasePackageMacOSAarch64
      - DesktopPackageUbuntuAmd64
      - DesktopPackageWindowsAmd64
      - DesktopPackageMacOSAarch64
      - NativePublish
    # 任一作业成功就要出校验和：已经挂在发布页上的资产必须能核对（部分平台失败也要有）。
    # 全都失败 / 被取消时不出——那时发布页上根本没有资产可核。
    if: >-
      always() && (needs.CliReleasePackageUbuntuAmd64.result == 'success'
      || needs.CliReleasePackageWindowsAmd64.result == 'success'
      || needs.CliReleasePackageMacOSAarch64.result == 'success'
      || needs.DesktopPackageUbuntuAmd64.result == 'success'
      || needs.DesktopPackageWindowsAmd64.result == 'success'
      || needs.DesktopPackageMacOSAarch64.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: DownloadReleasedAssets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # 只取 zip：SHA256SUMS 自身不在清单里（否则自指），重复执行时也不会把自己加进去
          gh release download "${TAG}" --pattern '*.zip' --dir assets
          ls -lh assets

      - name: VerifyAllAssetsPresent
        # 为什么要有这一步：`release` 与 `desktop` 是并列作业，任一成功本作业就会跑起来
        # （`if: always() && (… || …)`）。于是「只出了 CLI 包 / 只出了两个平台」时，
        # 发布页照样会生成、`SHA256SUMS` 照样会挂上 —— 而应用内升级按平台取件，
        # 用户那边看到的是「该版本没有本平台可用的包」。这种「部分发布」不能靠人盯。
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 .github/Python/ProjectVersion.py --resolve)
          # 期望清单**只从矩阵读**（issue #269 §3）：四组合 × 三平台 = 12 份。
          # 不再在工作流里硬编码资产名——那是「矩阵写在两处」的老问题。
          mapfile -t expected < <(python3 .github/Python/ReleaseMatrix.py --asset-names --version "${version}")
          missing=()
          for name in "${expected[@]}"; do
            [ -f "assets/${name}" ] || missing+=("${name}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::${TAG} 的发布资产不齐（缺 ${#missing[@]} 份）：${missing[*]}"
            {
              echo "### ❌ 发布资产不齐 —— ${TAG}"
              echo
              echo "缺 ${#missing[@]} 份（应用内升级按平台取件，缺哪份哪类用户就升不了）："
              printf -- '- `%s`\n' "${missing[@]}"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          echo "资产齐全：${#expected[@]} 份（CLI + 三平台桌面端）"

      - name: MarkReleaseIncomplete
        # 断言失败 = 「部分发布」：把它标成 pre-release，避免用户把它当完整正式版下载
        # （应用内升级只看 Stable / Latest，标成 pre-release 就不会被推荐）。
        # 修复后重跑，GenerateAndUploadChecksums 会把它恢复为正式版。
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --prerelease
          {
            echo "### ⚠️ 已把 ${TAG} 标为 pre-release"
            echo
            echo "发布资产不齐（见上一步的缺失清单）；补发成功后会自动恢复为正式版。"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: GenerateAndUploadChecksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          PYTHONUTF8=1 PYTHONIOENCODING=utf-8 python3 .github/Python/PackageManifest.py sums --dir assets
          # --clobber：重复发版（同一 tag 重跑）时覆盖旧的校验和，而不是报错退出
          gh release upload "${TAG}" assets/SHA256SUMS --clobber
          # 资产齐全 ⇒ 确认是完整正式版。补发从失败恢复时，把 MarkReleaseIncomplete
          # 打的 pre-release 标记撤回（有则改之，无则保持）。
          gh release edit "${TAG}" --prerelease=false
