# 快照出包的单一来源（issue #165 §三 / §四）——触发标签与变更分类路径清单。
#
# 为什么要有这个文件：同一份信息（「哪些路径算变更」「7 个标签叫什么」）会被
# `SnapshotJVM.yml` / `DesktopNative.yml` 与文档三处消费。三处各写一套的必然结果是漂移，
# 而漂移的表现是**静默**的——「某个改动悄悄不出包」或「打错标签却毫无反应」，都不报错。
# 因此清单写在这里，消费方必须与它逐字一致，由 `bin/CheckScripts.py` 断言拦下。
#
# 判定规则（与 #165 §四 一致）：
#   1. 先与 **B 组**比对：命中即**不出包**（B 组的 `aha-*/src/test/**` 与 A 组的
#      `aha-desktop/**` 重叠，故 B 优先——测试由 CI 的 `ui-smoke` 验证，不需要快照包）；
#   2. 否则与 **A 组**比对：命中即出包；
#   3. 都不命中（**C 组**：未列到的一切）⇒ 按 A 组处理（保守兜底：宁可多出一个包，
#      也不要出现「改了东西却没人拿到包」）。
#
# 标签：`SNAPSHOT:*` 决定「要不要这个目标」；`OS:*` 把原生线收窄到单平台，
# 与任一 `SNAPSHOT:*` 同时使用才生效（单独打不触发任何出包）。

labels:
  # 触发标签（4 个）：打在 PR 上即出包；**粘性**——PR 上还有标签则每次 push 重出，移除即停。
  snapshot:
    - SNAPSHOT:Desktop
    - SNAPSHOT:Cli
    - SNAPSHOT:NativeDesktop
    - SNAPSHOT:NativeCli
  # 平台限定标签（3 个）
  os:
    - OS:Win
    - OS:MacOS
    - OS:Ubuntu

paths:
  # A. 需要出包：影响产物，或影响「怎么出包」
  a:
    - aha-desktop/**
    - aha-cli/**
    - aha-common/**
    - aha-desktop-native/**
    - aha-cli-native/**
    - '**/pom.xml'
    - version
    - .github/Python/**
    - .github/workflows/**
    # 原生线的两条工作流：改它们会改「原生包怎么出」，因此显式列出（比 `.github/workflows/**`
    # 更精确，也满足守卫「消费方字面量与清单逐条一致」的要求）。
    - .github/workflows/DesktopNative.yml
    - .github/workflows/CliNative.yml
    # 本文件自身决定「怎么分类」。它与 C 组同效（都出包），显式列出是为了意图明确。
    - .github/SnapshotPaths.yml
  # B. 不出包：不进产物，但 PR 评论与 run 摘要要写明原因
  b:
    - Docs/**
    - '**/*.md'
    - CHANGELOG.md
    - AGENTS.md
    - .agents/**
    - bin/**
    - Script/**
    - Dist/**
    - aha-*/src/test/**
    - LICENSE
    - .gitignore
    - .gitattributes
  # C. 未列到的一切：按 A 组处理（保守兜底）。工作流不需要枚举它，列出只为口径完整。
  c:
    - '**'
