# Dependabot 配置：每日检测并升级依赖
#
# 覆盖两类依赖：
#   1. Maven 依赖 —— pom.xml（版本集中声明在父 POM 的 <properties>，一次升级即覆盖全部模块）
#   2. GitHub Actions 组件 —— .github/workflows/*.yml 中 uses: 引用的 action 版本
#
# 合入路径：Dependabot 的 PR 一律**先合入 dependa 分支**，不直接指向默认分支；
#           dependa 稳定后再由 dependa → 默认分支单独提 PR。
#
# 前置条件（否则本文件不生效）：
#   - 本文件必须位于**默认分支**
#   - dependa 分支必须已存在，且其中的 pom.xml / .github/workflows/ 与默认分支一致
#     （target-branch 指定后，Dependabot 读取的是该分支上的清单文件）
#
# 规范依据：Docs/DevSpec/BuildSpec.md 第 7 节；操作说明：Docs/Guide/BuildGuide.md 第 8 节。
version: 2

updates:
  # ── Maven 依赖 ──
  - package-ecosystem: maven
    directory: /
    target-branch: dependa
    schedule:
      interval: daily
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 15
    commit-message:
      prefix: chore
    labels:
      - dependencies
    groups:
      # minor + patch 合并为一个 PR，减少噪音；
      # major 不并入分组，逐个单独提 PR，便于阅读上游变更说明后再决定。
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── GitHub Actions 组件 ──
  - package-ecosystem: github-actions
    directory: /
    target-branch: dependa
    schedule:
      interval: daily
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 15
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
